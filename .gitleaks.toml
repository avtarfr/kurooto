# gitleaks (CI) with its default rules, plus one exception: the call line's test vectors are made-up keys
# (the bytes 0..31), there so Python, the Worker and the Android app can be checked against the same answers.
[extend]
useDefault = true

[[allowlists]]
description = "made-up test vectors, not real keys"
paths = ['''^tests/fixtures/call-vectors\.json$''']

[[allowlists]]
description = "third-party libraries vendored byte-for-byte (minified; their identifiers look like keys)"
paths = ['''^src/kurooto/web/static/vendor/''']
