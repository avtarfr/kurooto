name: android-emulator
# The Android app on old and new Android versions (6, 8, 10, 13, 15): it installs, opens, and handles a pairing link
# without crashing. Heavier than ci.yml, so it runs on Android changes, weekly, or by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths: ["android/**", ".github/workflows/android-emulator.yml"]
permissions:
  contents: read
jobs:
  emulator:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [23, 26, 29, 33, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the app
        run: android/build.sh
      - name: room for the emulator (the runner's disk is nearly full)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          disk-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: android/smoke.sh android/build/kurooto-debug.apk
      - name: keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens-api${{ matrix.api }}
          path: shots/
          if-no-files-found: ignore
