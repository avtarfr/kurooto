title = "Voice and voice notes"
page = "voice.md"
intro = """Kurooto speaks through this computer's speakers with a voice made here, and, if you turn listening on, hears
the room through the microphone, all on this computer: noise and people talking to each other are dropped on the spot,
and only what's said to Kurooto goes on, like a chat message. Voice notes you send on Telegram are written out by
Gemini."""
cost = "Sound is handled on this computer and never touches the disk. Only turns said to Kurooto go to your AI, as a chat message would."
needs = "The Voice feature."

[parent."voice.addons"]
tip = "What add-ons may do with Voice: hear one stretch of speech, and chat with someone the guest way."

[parent."voice.speak"]
tip = "How Kurooto speaks through this computer's speakers."
[parent."voice.listen"]
tip = "Listening through the microphone, all on this computer."
[parent."voice.audio"]
tip = "How sound reaches the speakers and comes in from the microphone."

[s."voice.speak.on"]
tip = "Kurooto speaks through this computer's speakers."
when = "Turn it off to keep Voice for listening only, or for a silent room."

[s."voice.speak.engine"]
tip = "The voice made on this computer: Kokoro (natural, about 0.55 GB), Piper (lighter) or off."
values = "`kokoro`, `piper` or `off`."
when = "Pick `piper` on an older computer; `kokoro` sounds more natural."
cost = "The voice's files are downloaded once."
needs = "`voice.speak.on`."

[s."voice.speak.voice"]
tip = "Which Kokoro voice it speaks in; empty is `af_heart`."
values = "A Kokoro voice name: `af_heart`, `af_bella`, `am_michael`, `bf_emma`, `bm_george` and more."
when = "Try a few with `/voice say` and keep the one you like."
needs = "`voice.speak.engine` = `kokoro`."

[s."voice.speak.rate"]
tip = "How fast it speaks: 1.0 is normal, 0.8 slower, 1.2 faster."
values = "A number around 0.5 to 2."
when = "Slow it down for long answers, speed it up if you're used to it."
needs = "`voice.speak.on`."

[s."voice.speak.what"]
tip = "What's read aloud: answers to what you said aloud, every AI answer, or nothing."
values = "`voice` (answers to what you said aloud), `all` (every AI answer) or `off`."
when = "Pick `all` if you work away from the screen."
needs = "`voice.speak.on`."

[s."voice.speak.max_chars"]
tip = "How much of a long answer is read aloud before it says \"the rest is on screen\"."
values = "Characters."
when = "Raise it to hear long answers in full."
needs = "`voice.speak.on`."

[s."voice.speak.join_sentences"]
tip = "Speak short sentences together, up to about 200 characters at a time, instead of each on its own."
what = "Kokoro reads a few words on their own with a hurried, flat tune; joined to their neighbours they get a natural one, and it still pauses at each full stop. The first piece is kept under about 120 characters, so speech starts as soon as before."
values = "`true` (short sentences joined) or `false` (one sentence at a time, as before 0.8.13)."
when = "Turn it off if a long pause before the first word bothers you on a slow computer."
needs = "`voice.speak.on`."

[s."voice.speak.numbers_as_words"]
tip = "Say numbers as a person would: 21:31 as \"nine thirty-one PM\", ₹3,000 as \"three thousand rupees\"."
what = "Times, dates, years, money, versions, ranges, percentages and units are said in words: 12 GB as \"twelve gigabytes\", 0.8.13 as \"zero point eight point thirteen\", 2026 as \"twenty twenty-six\". Only what's said changes; the screen shows what was written."
values = "`true` (times, dates, years, money, versions, ranges and units in words) or `false` (the speech engine reads the digits itself)."
when = "Turn it off if it ever reads a number wrongly and you'd rather hear the engine's own reading."
needs = "`voice.speak.on`."

[s."voice.listen.on"]
tip = "Listen through the microphone, all on this computer; only what's said to Kurooto leaves it."
when = "Turn it on to talk to Kurooto out loud. It stops during calls, when paused, on battery saver and when muted."
cost = "The speech models are downloaded once. Only turns addressed to Kurooto go to your AI."

[s."voice.listen.wake_word"]
tip = "A wake-word model of your own (an openWakeWord `.onnx` path); empty: its name wakes it."
values = "A full path, or empty."
when = "Only if you trained your own wake word."
needs = "`voice.listen.on`."

[s."voice.listen.wake_threshold"]
tip = "How sure the wake-word model must be (0 to 1)."
when = "Raise it if it wakes by mistake; lower it if it misses you."
needs = "`voice.listen.wake_word`."

[s."voice.listen.name_variants"]
tip = "More spellings of its name to accept (the common mishearings of Kurooto are built in)."
values = "A list of spellings."
when = "Add the way the transcriber writes the name you gave it, if it keeps missing it."
needs = "`voice.listen.on`."

[s."voice.listen.model_judge"]
tip = "When the rules can't tell whether you're talking to it, the model on this computer judges."
when = "Turn it off to use rules only (fewer false starts, more misses)."
cost = "Nothing leaves: a local model."
needs = "`voice.listen.on` and Local AI models."

[s."voice.listen.threshold"]
tip = "How sure the local model must be (0 to 1) that speech is said to Kurooto."
when = "Raise it if it answers conversations not meant for it; lower it if it ignores you."
needs = "`voice.listen.model_judge`."

[s."voice.listen.after_speak_s"]
tip = "Seconds after it spoke during which a question counts as an answer to it."
when = "Raise it if you think before answering."
needs = "`voice.listen.on`."

[s."voice.listen.close_s"]
tip = "Seconds of nothing said to it before the spoken conversation closes."
when = "Raise it for slower back-and-forth."
needs = "`voice.listen.on`."

[s."voice.listen.night"]
tip = "Keep listening during the night hours."
when = "Turn it off to stop listening at night."
needs = "`voice.listen.on`."

[s."voice.listen.calls"]
tip = "Keep listening while you're on a phone call (off: listening pauses during calls)."
when = "Turn it on only if your calls are on another device out of earshot."
needs = "`voice.listen.on`."

[s."voice.listen.stt_model"]
tip = "How big the speech-to-text model is: tiny (75 MB), base (145 MB) or small (484 MB, more accurate)."
values = "`tiny`, `base` or `small`."
when = "Pick `small` if it often mishears you and the computer is fast enough."
cost = "The model is downloaded once."
needs = "`voice.listen.on`."

[s."voice.listen.language"]
tip = "The language you speak, e.g. `en` or `hi`; empty works it out each time."
values = "A language code, or empty."
when = """Set it if it guesses your language wrong, or misses its name: worked out on each short clip, an accent is
often taken for another language (English for Hindi or Urdu) and the name never comes out right."""
needs = "`voice.listen.on`."

[s."voice.listen.early"]
tip = "Write the words out at your first short pause, so the turn goes on the moment you've finished."
what = """At your first pause of about 0.3 seconds, what you've said so far is written out (on this computer) while
Kurooto still waits to see if you go on. If you don't, the turn goes straight on with those words instead of writing
the whole stretch out again, and a finished question (or a finished sentence of three words or more) ends the turn
after 0.35 to 0.55 seconds of quiet instead of 0.7. If you go on talking, the early words are thrown away. With Voice
ID's gate on, a voice that isn't yours (with no conversation open) is never written out early. Nothing is sent
anywhere early: only the writing out happens sooner."""
values = "`true` (default), `false` (the words are written out after 0.7 seconds of quiet, as before)."
when = "Turn it off if Kurooto starts answering while you're only pausing mid-thought."
needs = "`voice.listen.on`."

[s."voice.listen.auto_gain"]
tip = "Hearing follows the room: speech must stand above its noise, and a quiet voice is evened up."
what = """While nothing is being said, Kurooto follows the room's noise floor (the loudness of what isn't speech, over a
few seconds). Speech starts a stretch only when it's at least voice.listen.auto_gain_snr_db above that floor, so a
noisy room asks for a clearer voice and a quiet one still hears a soft one. Each stretch is then brought to one level
(never turned down, at most eight times louder, never clipped) before it's written out, so a quiet or far voice reads
as well as a near one. All inside Kurooto: the system's microphone volume is never changed, so calls and other apps
hear exactly as before. Only the noise floor and the last gain are kept (in memory, numbers only; /voice status)."""
values = "`true` (default), `false` (every stretch the voice detector finds counts, at the level it came in)."
when = "Turn it off if soft speech close to the microphone is missed in a noisy room."
needs = "`voice.listen.on`."

[s."voice.listen.auto_gain_snr_db"]
tip = "How far above the room's noise speech must be to count, in dB."
values = "A number of dB, 0 or more (default 6). Higher is stricter in a noisy room; 0 lets any speech through."
when = "Raise it if far-off talk or a TV starts stretches; lower it if you're missed when you speak softly."
needs = "`voice.listen.auto_gain`."

[s."voice.listen.device"]
tip = "Which microphone to use; empty is the system's default."
values = "A device's name or number as your sound system lists it (the sounddevice library's names)."
when = "Set it if you have several microphones."
needs = "`voice.listen.on`."

[s."voice.audio.backend"]
tip = "How Kurooto plays and records sound: PipeWire's own tools, or the PortAudio library inside Kurooto."
what = """`pipewire`: speech plays through `pw-play` and the microphone is read through `pw-record`, separate programs, so
a sound driver problem can't take Kurooto down, and the microphone follows your system's default (a source that comes
and goes is picked up again). `portaudio`: the sounddevice library inside Kurooto, as before 0.8.16. `auto` picks
`pipewire` on Linux when PipeWire is running and its tools are installed, unless `voice.listen.device` names a
microphone (those are sounddevice's names); else `portaudio`. Takes effect for speaking at once, for listening the
next time it starts (`/voice mute`, then `/voice unmute`)."""
values = "`auto` (default), `pipewire` or `portaudio`."
when = "Pick `portaudio` if speech or the microphone misbehaves through PipeWire's tools, or to use a sounddevice microphone by name; `pipewire` to pass a PipeWire node name in `voice.listen.device`."
needs = "The Voice feature."

[s."voice.listen.levels"]
tip = "Show the microphone's loudness as a waveform on the dashboard (numbers only)."
when = "Turn it off if you don't watch the waveform."
needs = "`voice.listen.on`."

[s."voice_notes.model"]
tip = "Which Gemini model writes out your voice notes."
values = "A Gemini model name."
when = "Change it when a better or cheaper speech model is out."
cost = "Each voice note's audio goes to Google with your Gemini key."
needs = "Voice notes, and a Gemini key."

[s."voice_notes.api_base"]
tip = "Another address for the voice-note model; empty is Google's."
values = "A web address, or empty."
when = "Only for a proxy or a compatible server of your own."
cost = "Voice notes go to that address."
needs = "Voice notes."

[parent."voice.speaker_id"]
tip = "Voice ID: Kurooto knows your voice, so only you can make it act; anyone else can only chat. All on this computer."

[s."voice.speaker_id.on"]
tip = "Voice ID: only your voice can make Kurooto act; others can only chat, with none of your data. Enrol first."
values = "`true` (each turn is checked against your voice print, on this computer), `false` (any voice is treated as yours, as before)."
when = "Turn it on if other people are ever near the computer while Voice listens. Enrol on the Your voice page first."
cost = "About 20-60 ms of processor per thing said. Your voice print is stored encrypted on this computer, never sent anywhere."
needs = "Voice: talk and listen, and an enrolled voice."

[s."voice.speaker_id.mode"]
tip = "What other voices get: a chat with no actions and none of your data, or just one line saying it only talks with you."
values = "`owner_only_acts` (others may chat), `owner_only_at_all` (others hear one line, nothing more)."
when = "Pick `owner_only_at_all` if you don't want Kurooto chatting with anyone else at all."

[s."voice.speaker_id.gate"]
tip = "Check who's speaking before writing words out: other people not calling Kurooto are never transcribed."
values = "`true` (others' talk is dropped before transcription), `false` (everything is transcribed, then sorted as in 0.8.8)."
when = "Leave it on: it keeps other people's conversations private and saves the transcription's processor time."

[s."voice.speaker_id.guest_brain"]
tip = "Who answers other voices: your AI (none of your data, no tools) or the model on this computer."
values = "`main` (your AI, only if it can be held to plain text: an API or Claude Code; with agy or Codex the local model answers), `local` (always this computer)."
when = "Pick `local` to keep guests' words on this computer."
needs = "For `local`, Local AI models with a chat model."

[s."voice.speaker_id.guest_per_hour"]
tip = "At most this many answers to other voices an hour."
when = "Lower it if guests use up your AI's quota."

[s."voice.speaker_id.tell_guests"]
tip = "Once per conversation, tell others they can chat but only you can make Kurooto act."
when = "Turn it off if you'd rather it just chats without saying so."

[s."voice.speaker_id.strictness"]
tip = "How sure it must be that it's you: relaxed, normal or strict (strict turns you away more often)."
values = "`relaxed`, `normal`, `strict`."
when = "Strict if a lot of people are around; relaxed if it keeps asking you again in a noisy room."

[s."voice.speaker_id.threshold"]
tip = "0: worked out from your own samples when you train. A number overrides it, held to 0.30 to 0.95."
when = "Leave it at 0 unless the Test step on the Your voice page shows it gets it wrong."

[s."voice.speaker_id.margin"]
tip = "The 'not sure' band just below the threshold, at most 0.2 wide. Not sure always counts as not you."
when = "Widen it to be safer; narrow it if you're asked to repeat yourself too often."

[s."voice.speaker_id.min_speech_s"]
tip = "Speech shorter than this is too short to tell who it is, so it counts as not sure."
when = "Raise it if quick one-word sounds get mistaken; lower it if your short answers are often 'not sure'."

[s."voice.speaker_id.carry"]
tip = "A short reply right after a turn it knew was you counts as you (not when the voice is clearly someone else)."
when = "Turn it off (or use strict) if guests could answer 'yes' for you."

[s."voice.speaker_id.carry_s"]
tip = "The window, in seconds, in which a quick reply after you spoke still counts as you."
when = "Shorten it in a shared room; lengthen it if your quick follow-ups get refused."

[s."voice.speaker_id.adapt"]
tip = "Improve over time: turns it was very sure were you refine your voice print, slowly and with undo."
values = "`false` (default: your voice print stays as trained), `true`."
when = "Turn it on if your voice changes (a cold, a new mic) and you'd rather it keeps up by itself."

[s."voice.speaker_id.adapt_max"]
tip = "At most this many learned turns are kept in your voice print (the oldest are replaced)."
when = "Lower it to keep your voice print closer to the samples you trained with."

[s."voice.speaker_id.adapt_per_day"]
tip = "A daily cap on how many of your turns may be added to your voice print."
when = "Lower it to make the voice print change more slowly."

[s."voice.speaker_id.model"]
tip = "The speaker model: campplus-en (English, the most accurate) or campplus-multi. Changing it means enrolling again."
values = "`campplus-en`, `campplus-multi`."
when = "Pick campplus-multi if you speak to Kurooto mostly in another language."

[s."voice.addons.listen"]
tip = "Let an add-on take one stretch of speech at a time through the microphone (written out here, never sent)."
what = """An add-on may ask for the next thing said, by any voice, while Kurooto is listening: it's written out on
this computer and handed to that add-on only, never to the gate, the conversation or your AI. Mute, the night, calls
and every other pause still stop it, and it never takes a conversation that's open with you."""
when = "Turn it off to keep add-ons from hearing anything."
needs = "`voice.listen.on`, and an add-on that uses it."

[s."voice.addons.guest_name"]
tip = "Let an add-on that recognises a guest name them: a greeting by name, the name to a local guest AI only."
what = """For a turn Voice ID called a guest, a feature that knows who is in front of it (an add-on's guest_name()) may
give their name. Voice puts \"Hi <name>.\" before the first answer of the conversation, a set phrase it makes itself.
The name goes into the guest's prompt only when guests are answered on this computer (voice.speaker_id.guest_brain:
local, or a main AI that can't be held to text); never to your main AI, and it isn't kept, logged or put in an event."""
when = "Turn it off to keep add-ons from naming guests."
cost = "Nothing: the add-on answers on this computer."
needs = "Voice ID (voice.speaker_id.on) and an add-on that recognises people."

[s."voice.addons.chat"]
tip = "Let an add-on have Kurooto chat with someone who isn't you, the guest way: no tools, none of your data."
what = """The add-on's chat goes through the same sealed path as another voice's (Voice ID's guests): text only, no
tools, none of your notes, memory or history, refusals for commands and your things, and the hourly guest limit.
voice.speaker_id.guest_brain picks who answers."""
when = "Turn it off to keep add-ons from starting chats."
cost = "One AI turn per reply, from your main AI or this computer's model (voice.speaker_id.guest_brain)."
needs = "An add-on that uses it."

[s."voice.speaker_id.spoken_enrol"]
tip = "During enrolment Kurooto says each step aloud. Off: the page shows the steps only."
when = "Turn it off if you enrol somewhere you can't have it talk aloud."

[s."voice.listen.conversation_mode"]
tip = "While another voice is here, Kurooto stays out of people talking: only its name said to it opens a talk."
values = "`true` (default with Voice ID), `false` (the usual gate)."
when = "Leave it on so it doesn't join your conversations with other people; nothing said then is kept."
needs = "Voice ID (it knows which voice is yours)."

[s."voice.listen.conversation_s"]
tip = "Seconds after the other person last spoke before Kurooto stops staying out of the conversation."
when = "Lengthen it if Kurooto joins in too soon after the other person stops talking."

[s."voice.listen.conversation_follow_s"]
tip = "In conversation mode, a reply to what Kurooto just said counts only this soon after it."
when = "Lengthen it if your replies to Kurooto in a conversation get ignored."
[s."voice.listen.careful_name"]
tip = "When someone else may be talking, its name wakes Kurooto only said first, as a call (\"Kurooto, what's ...\")."
what = """Someone else may be talking when Voice ID isn't sure the voice is yours (or knows it isn't), when people talked
here within voice.listen.chatter_s without talking to Kurooto, or when Face presence sees two or more faces. Then its
name at the end or in the middle of a sentence, or a word that only sounds like it, is just a mention: the other rules
and the model on this computer decide. With you alone, its name first or last still wakes it as before."""
values = "`true` (default), `false` (its name first or last always wakes it, as before 0.8.13)."
when = "Leave it on if Kurooto joins your conversations when you mention it; turn it off if it ignores you at the end of a sentence when you're alone."

[s."voice.listen.chatter_s"]
tip = "Speech here that wasn't to Kurooto (any voice) this many seconds ago makes it careful with its name."
when = "Lengthen it if it still jumps into a conversation that paused for a while."

[s."voice.listen.follow_s"]
tip = "After Kurooto answers, what the same voice says this many seconds after counts as said to it, statements too."
what = """You don't have to say its name again to go on: within this window of its answer ending, anything the voice it
answered says goes to it. Another voice, two voices at once, or being told off ("not you", "stop") end it. In
conversation mode this window applies to the voice that opened the talk instead of voice.listen.conversation_follow_s.
The conversation stays open at least this long after an answer."""
values = "Seconds; `20` (default), `0` (off: only questions and requests within voice.listen.close_s count)."
when = "Shorten it (or 0) if it takes what you say to someone else right after its answer; lengthen it if it stops listening while you think."

[s."voice.listen.told_off"]
tip = "\"Stop\", \"not you\", \"never mind\" and the like, right after it woke or spoke, stop it at once and close the talk."
what = """Within about 10 seconds of the conversation opening or of Kurooto speaking: it stops speaking, closes the
conversation and doesn't reply. It notes a misfire (the rule that opened it, never your words) and, with
voice.listen.learn_nightly, a training row of numbers for the night's learning. With voice.listen.barge_in you can
say it over Kurooto while it speaks; without it, say it as soon as it stops, or use /voice stop."""
when = "Turn it off if one of those phrases is something you often say to Kurooto as a request."

[s."voice.listen.barge_in"]
tip = "Talk over Kurooto while it speaks to stop it: \"stop\", a new question, or anything you want to say."
what = """While Kurooto speaks it keeps listening, but never takes its own voice coming back through the room for you.
A stretch of speech counts as you cutting in when Voice ID (on and enrolled) recognises your voice in it (at least
about 0.6 seconds of speech, closer to your voice print than to Kurooto's own, which is made once in memory from a
phrase its voice says silently), or when it's clearly louder than the echo of what's playing just then and its words,
written out here, aren't Kurooto's own. Then it goes quiet at once (on this computer, or on another device an
add-on plays it on), and what you said is: a told-off phrase ("stop", "never mind"): it stops; a question or a
request: a new turn in the same conversation; anything else ("mm", a cough, a word to someone else): it carries on,
saying the sentence it was cut in from its start (0.8.17), or stops if that isn't settled within about 12 seconds. Limits: on a speakerphone or at a
high volume its echo can drown you out, so speak up or come closer; without Voice ID only the loudness check works;
and with Voice ID only your voice can cut in by voice (a guest has to be louder than its echo). Nothing extra is kept:
the sound stays in memory as for any stretch, and the event says only how it was noticed and what came of it."""
values = "`true` (default), `false` (the microphone is dropped while it speaks, as before; /voice stop still stops it)."
when = "Turn it off if Kurooto stops for the TV or other people talking loudly near it while it speaks."

[s."voice.listen.need_face"]
tip = "Answer only someone in front of it: a face close to the camera and facing it while they speak."
what = """With Face presence on and enrolled, a turn is answered only when the camera saw a face close to it
(voice.listen.face_near) and facing it (voice.listen.face_yaw_deg) while it was said or within about 1.5 seconds after.
Anything else, by any rule (its name, a follow-up, the local model's judgement, cutting in), is chatter: someone on a
phone call across the room, the TV, a person talking to you from the door. The wake word and the told-off phrases
("stop", "never mind") work without a face, and typed /voice commands are never affected. While Voice listens it keeps
Face presence's camera looking (its card says "voice: who's talking"), never past Face presence's own pauses: a call,
a locked screen, /face pause, the night, a busy or covered camera; then voice.listen.need_face_fallback decides. Only
the time of each look and how many faces were close and facing are kept, in memory: no picture, no face numbers. With
Face presence off or not enrolled this does nothing."""
values = "`true` (default), `false` (the voice rules alone, as before)."
when = "Turn it off if you often talk to Kurooto from across the room or without looking at the screen."
cost = "The camera's light stays on while Voice listens, and a little processor time; on Linux a video call app can't use the camera then (/voice mute or /face pause frees it)."
needs = "Face presence on and enrolled; Voice listening."

[s."voice.listen.face_near"]
tip = "How close counts: a face at least this share of your usual face height at the desk (0.5 is about twice as far)."
what = """Your usual height comes from Face presence's recent sightings of you at the desk (or your enrolment). Until
it knows, a face at least face.recognise.min_face_px tall counts."""
values = "A number from 0.1 to 1."
when = "Lower it if it ignores you when you lean back or sit further away; raise it if it answers people across the room."
needs = "`voice.listen.need_face`."

[s."voice.listen.face_yaw_deg"]
tip = "How directly someone must face the camera: turned at most this many degrees away (an estimate)."
values = "Degrees, 10 to 80."
when = "Raise it if it ignores you when you glance at a second screen; lower it if it answers people talking side-on."
needs = "`voice.listen.need_face`."

[s."voice.listen.need_face_fallback"]
tip = "What happens when the camera can't see (paused, covered, busy, no camera): the voice rules alone, or nothing."
what = """`voice`: it answers by the voice rules alone, as without voice.listen.need_face. `none`: nothing is answered by
voice until the camera can see again; the wake word and "stop" still work. /voice and /health say which applies now
("needs a face: camera paused (screen locked), using voice rules")."""
values = "`voice` (default) or `none`."
when = "Pick `none` if being answered when nobody's there is worse than not being answered."
needs = "`voice.listen.need_face`."

[s."voice.listen.look_to_talk"]
tip = "Look at the camera for a second and Kurooto starts listening, as if you'd said its name."
what = """With Face presence on and enrolled, your face (recognised as yours), close to the camera and turned to it
within voice.listen.look_yaw_deg and voice.listen.look_pitch_deg, for voice.listen.look_dwell_s, opens the conversation
the way its name alone does, without a sound: the next thing you say counts as said to it, no name needed. The camera
sees which way your head points, not your eyes, so the angles are tighter than voice.listen.face_yaw_deg: looking at
the screen beside the camera shouldn't count. It stays open while you keep looking; look away for
voice.listen.look_away_s before saying anything and it closes. A conversation already going on is left alone. One look
opens it once: after it closes (you said something not to it, "stop", or looked away) look away and back. It never
opens while Voice is off or muted, on a call, at night with listening off, while Kurooto is asleep, or with Face
presence off or paused. What you then say still goes through the other checks: with Voice ID, someone else's voice
isn't even written out; two voices at once, or people talking here lately, need a question or a request. Only two
times are kept, in memory: when you started looking and when you last did."""
values = "`true` (default), `false` (only its name, the wake word and the usual follow-ups open it)."
when = "Turn it off if it starts listening while you're only reading something near the camera."
cost = "Like voice.listen.need_face, the camera stays looking while Voice listens (its light on), and a little processor time."
needs = "Face presence on and enrolled; Voice listening."

[s."voice.listen.look_dwell_s"]
tip = "How long you look at the camera before it starts listening: a glance shorter than this doesn't count."
what = """Face presence looks about once a second (every 3 seconds on battery), so the wait is this long or a little
more."""
values = "Seconds, 0 to 10 (default 1)."
when = "Raise it if passing glances open it; lower it to have it react sooner."
needs = "`voice.listen.look_to_talk`."

[s."voice.listen.look_yaw_deg"]
tip = "How straight at the camera your head must point, left or right: at most this many degrees (an estimate)."
values = "Degrees, 5 to 35 (default 15)."
when = "Raise it if looking at the camera doesn't open it; lower it if looking at the screen next to it does."
needs = "`voice.listen.look_to_talk`."

[s."voice.listen.look_pitch_deg"]
tip = "How straight at the camera your head must point, up or down, judged against your face at enrolment."
what = """Measured from the front step of your Face presence enrolment (where you looked straight at the camera). If
that isn't on record, only the left-right angle counts."""
values = "Degrees, 5 to 35 (default 15)."
when = "Raise it if it misses you when the camera sits above the screen; lower it if looking down at the keyboard opens it."
needs = "`voice.listen.look_to_talk`."

[s."voice.listen.look_away_s"]
tip = "Looking away this long, before you've said anything, closes it again."
values = "Seconds, 0 to 30 (default 3)."
when = "Raise it if it closes while you glance at your notes before asking."
needs = "`voice.listen.look_to_talk`."

[s."voice.listen.look_gaze"]
tip = "With your eyes calibrated on the Face page, a look counts by your eyes on the camera, not your head's turn."
what = """Needs the eye model (Get the eye model on the Face page: MediaPipe Iris, 2.6 MB) and Calibrate my eyes
(about three seconds looking at the camera's lens). Then each frame, while Voice listens, the irises are found in your
eyes (cut from the camera's full picture) and combined with your head's turn: eyes on the lens count even with your
head a little turned, and eyes on the screen below the camera don't, even with your head facing it. Calibration keeps
four numbers in your sealed face model (where your irises sat and how your head was turned), never a picture; Clear on
the Face page drops them, and Forget drops them with the rest. Without the model or a calibration, or with this off,
the head's turn counts (voice.listen.look_yaw_deg and look_pitch_deg), and /voice says which."""
values = "`true` (default), `false` (the head's turn only)."
when = "Turn it off if glasses or the light make your eyes hard to read and looks stop opening it."
cost = "About 7 ms of one processor core per frame while Voice listens, for the eyes (measured on a Ryzen 7 laptop)."
needs = "`voice.listen.look_to_talk`; the eye model and a calibration (the Face page)."

[s."voice.listen.look_gaze_dwell_s"]
tip = "By the eyes: how long your eyes must be on the camera before it starts listening (0: at once)."
what = """With your eyes calibrated, eyes on the lens are a clear sign, so by default the first frame that sees them
there opens the conversation (Face presence looks up to 5 times a second while Voice listens: face.watch.look_fps).
Without a calibration, voice.listen.look_dwell_s applies instead."""
values = "Seconds, 0 to 5 (default 0)."
when = "Raise it a little (0.3) if a passing glance at the camera opens it."
needs = "`voice.listen.look_gaze` and a calibration."


[s."voice.listen.look_anyone"]
tip = "Anyone's look opens the conversation, not only yours: a guest looking at it can talk to it too."
what = """Face presence reads where every close face looks (the three biggest besides yours), by the head's turn, or by
the eyes judged against your calibration when you've calibrated. People talking to each other without looking at it
stay ignored. A guest is still a guest: Voice ID decides, and someone who isn't you gets chat only (no tools, none of
your data). Only numbers for where a face points are used, never who it is, and they go with the frame."""
when = "Turn it off to have only your own look open it (as 0.8.17)."
needs = "`voice.listen.look_to_talk`, Face presence on and enrolled."

[s."voice.listen.phone_away"]
tip = "Stop listening while your phone is out (it left a place you saved)."
what = "Uses Brain's phone places sensor. Listening stops when the phone leaves a saved place and starts again when it arrives at one, or when someone is back at the desk (a face Face presence knows, or the keyboard). Only that the phone left goes into it, never the place."
when = "Turn it on if you'd rather the microphone rested while you're away from home."
needs = "Brain on and its phone places sensor (mind.senses.phone.places)."

[s."voice.listen.look_in_company"]
tip = "With others here, looking at it and saying its name (even misheard) counts as calling it."
what = """With two or more faces in view or other voices about, its name has to be said first and heard exactly.
After a look, its name first or last spelled any way (a near miss too) is enough, so a garbled transcript doesn't
drop what you said."""
when = "Turn it off to have a look count, in company, only before a question or a request."
needs = "`voice.listen.look_to_talk`."
[s."voice.listen.look_gaze_yaw_deg"]
tip = "By the eyes: how close to the camera's lens your gaze must be, left or right (an estimate in degrees)."
values = "Degrees, 3 to 30 (default 10)."
when = "Raise it if looking at the camera doesn't open it; lower it if looking at a screen beside it does. The Face page shows your last look's angles while Voice listens."
needs = "`voice.listen.look_gaze` and a calibration."

[s."voice.listen.look_gaze_pitch_deg"]
tip = "By the eyes: how close to the camera's lens your gaze must be, up or down (an estimate in degrees)."
values = "Degrees, 3 to 30 (default 10)."
when = "Raise it if it misses you; lower it if looking at the screen just below the camera opens it."
needs = "`voice.listen.look_gaze` and a calibration."

[s."voice.listen.learn_nightly"]
tip = "Every night Kurooto learns from how its voice turns went: ones you carried on with, and ones you told off."
what = """Each turn the gate let through is labelled once it's known how it went: you went on talking to it (good), or
told it off (a misfire). Only flags and numbers are kept, in Kurooto's state under voice/: the rule that decided, how
its name was said, how many voices, Voice ID's decision and score, seconds since other talk, faces in view; never words
or sound. At night (04:10) a small model is fitted to them; with 20 turns or more, some of each, it can hold back a
borderline opening (its name heard only as a near miss, a follow-up, the local model's judgement) that looks like past
misfires. It can never stop its name said first ("Kurooto, ..."). /voice and /health show the numbers; forgetting your
voice (/voice id forget) deletes them too."""
values = "`true` (default), `false` (nothing recorded, nothing held back)."
when = "Turn it off to keep the gate's rules fixed."

[s."voice.speaker_id.face_assist"]
tip = "When Voice ID is only \"not sure\" it's your voice and Face presence sees just your face, it counts as you."
what = """Only a voice already inside the "not sure" margin, only while the camera's last look (a few seconds old at most)
shows exactly one face and it's yours. A voice clearly not yours, two voices, two faces, or strict strictness never
count. With "improve over time" (voice.speaker_id.adapt) on, such a turn that went well may be added to your voice
print like a very sure turn, with the same caps and undo."""
values = "`true` (default), `false`."
when = "Turn it off if a photo of you plus a voice close to yours is a risk where you are."
needs = "Voice ID and Face presence, both enrolled."

[s."voice.speaker_id.carry_talk"]
tip = "In a talk Voice ID knew you opened, a voice it's only \"not sure\" of stays you, so history and tools carry."
what = """Extends voice.speaker_id.carry: not only a short reply, but any turn whose score is inside the "not sure" margin,
while the conversation you opened is open and within voice.speaker_id.carry_s or voice.listen.follow_s (the longer) of
its last answer to you. A voice clearly someone else's, or two voices, are never carried; strict turns it off."""
values = "`true` (default), `false` (only short replies carry, as before 0.8.13)."
when = "Turn it off in a shared room where someone with a voice like yours might carry on your conversation."

[s."voice.speak.ack"]
tip = "While your AI thinks, a short soft sound says Kurooto heard you."
what = """The moment a turn you said goes to your AI, a soft sound plays through the same speakers or output as its voice
(a phone an add-on plays it on, say), so the silence while the AI works doesn't feel like it didn't hear. It's skipped
when the answer is already on its way (a plain-English request done at once) or something is being said. `tone` is a
short, quiet rising note made on this computer; `word` is "Hmm." in Kurooto's own voice, made once and kept in memory.
Only for turns heard through the microphone; never for typed messages."""
values = "`tone` (default), `word` or `off`."
when = "Pick `word` if a voice sounds friendlier to you than a note; `off` if you'd rather have silence."
needs = "`voice.speak.on` and `voice.listen.on`."

[s."voice.speak.stream"]
tip = "Speak the answer a sentence at a time while your AI is still writing it."
what = """When your AI can stream its answer (Claude Code, a Gemini key or Ollama answering without tools), each finished
sentence is spoken as soon as it arrives, instead of after the whole answer is in; the rest follows as it's written.
Words the AI writes before it uses a tool ("Let me check your notes.") are spoken too. An AI that can't stream (agy) is
spoken when it's done, as before. /voice stop, mute and talking over it stop it at once."""
values = "`true` (default) or `false` (the whole answer first, as before 0.8.16)."
when = "Turn it off if you'd rather hear only the finished answer."
needs = "`voice.speak.on`."

[s."voice.listen.timing"]
tip = "Time each spoken turn from your last word to Kurooto's first sound, as numbers only."
what = """Each turn that goes to your AI is timed from the end of your speech: written out, decided (the face check
included), sent, the AI starting, its first words, the whole answer, the acknowledgement, the first sound made and the
first sound playing (on an add-on's output: when it's handed the sound). One voice_timing event a turn (milliseconds,
never words), and the medians of the last 20 turns in /voice and on GET /api/voice ("speed"). Kept in memory."""
values = "`true` (default) or `false`."
when = "Leave it on; turn it off only if you don't want the events in the log."
needs = "`voice.listen.on`."

[s."voice.listen.fast_brain"]
tip = "Which AI answers plain chat said aloud: your AI as usual, the model on this computer, or the quickest."
what = """Only turns that need nothing of yours and no tools are moved: small talk and general questions with none of
"my", "notes", "remind", "today", "search" and the like, that no plain-English request of Kurooto's would take. Those
are asked as text only at low effort. `same`: your AI with its tools, as always. `local`: the Ollama model on this
computer (nothing leaves it). `fastest`: the quickest set up here by its first words in your recent voice turns (each
is tried once first: your AI when it's a service, a Gemini key, the model on this computer, then your AI with no
tools). Anything else, and every turn when unsure, goes to your AI as before."""
values = "`same` (default), `local` or `fastest`."
when = "Pick `local` or `fastest` if chatting by voice feels slow and you don't mind a smaller model for small talk."
needs = "`voice.listen.on`; `local` needs Local AI models (Ollama) set up."

[s."voice.listen.warm_up"]
tip = "When listening starts, warm the transcriber and the voice, so your first turn isn't the slow one."
what = """Half a second of silence is written out (on the hearing thread, never beside a turn) and one word is made by
the voice and never played, once each time they're loaded. Nothing is recorded or sent."""
values = "`true` (default) or `false`."
when = "Turn it off on a computer short of memory if you rarely talk to it."
needs = "`voice.listen.on`."

[s."voice.listen.warm_brain"]
tip = "When listening starts, get your AI's program ready on this computer."
what = """With Claude Code as your AI, its program is run once for its version (at most every 10 minutes), so its files
are read from the disk then and not on your first turn; nothing is sent. With voice.listen.fast_brain `local`, the
model on this computer answers one word so it's loaded. After your first turn, `brain.claude.session` keeps Claude
Code running for the conversation, so later turns don't start it again."""
values = "`true` (default) or `false`."
when = "Turn it off if you don't want the extra start of the AI's program."
needs = "`voice.listen.on`."

[s."voice.listen.live"]
tip = "Your own turns answered by Gemini Live, speech to speech, in about a second. Their sound goes to Google."
what = """Instead of writing your words out, asking your AI and making the answer's voice here, the turn's sound goes to
Google's Gemini Live (with your Gemini key) and its spoken answer plays through the same speakers or add-on output.
A different AI answers: Google's Live model, with the tools a phone call has. What leaves the computer is the sound of
the turns Kurooto already decided you said to it, and only those: the gate called it addressed (not chatter or noise),
Voice ID said it's your voice, and you were facing it, close by: only turns you say to it while facing it, close by
(the face check saw a face near the camera and turned to it during the turn). A turn let through without a face seen
(the wake word and the request right after it, voice.listen.need_face off, Face presence off or paused, or the camera
blind with voice.listen.need_face_fallback "voice") goes the usual way, as do chatter, other voices and a voice it's
unsure of. With each session goes what a call's setup carries (your name, the assistant's, which tools exist, the
lessons from earlier calls), and a turn's tool results (a note it reads, say). The session stays open while the
conversation does and closes with it. Tools that need your tap ask Approve / Deny first. No key, Google refusing, or
no sound within about 5 seconds: that turn goes the usual way. Nothing is written to disk; events hold numbers
only. It uses calls.live_model (then calls.live_models) and calls.voice."""
values = "`false` (default) or `true`."
when = "Turn it on if you want quick spoken answers at the desk and are fine with your voice going to Google."
needs = "`voice.listen.on`, a Gemini key, Voice ID (`voice.speaker_id.on`, enrolled) and Face presence."

[s."voice.speak.stop_when_gone"]
tip = "Stop reading an answer when Face presence sees you've left the desk; the rest is offered when you're back."
what = "It goes by Face presence's \"stepped away\" (face.away.on, after face.away.after_min), never a turned head. The unread rest is on screen, and the greeting says an answer came while you were away; a yes reads it."
when = "Turn it on if long answers keep playing to an empty room."
needs = "Face presence on with face.away.on."

[s."voice.mirror_to_chat"]
tip = "What Kurooto says aloud by itself also shows in the app's and the dashboard's Chat."
what = "A greeting or an add-on's spoken line appears as \"Said aloud at your desk\" (never on Telegram), and the next thing you type in any chat is told what it said, so you can answer by typing. Answers to you aren't repeated."
when = "Turn it off to keep spoken lines out of Chat."
cost = "With Phone calls on, the line goes to your phone app like any chat message (sealed, through your call line)."

[s."voice.listen.count_voices"]
tip = "Two faces close to the camera plus a voice that isn't yours: people talking to each other, not to Kurooto."
what = "Face presence's count of close, facing faces (in memory) and Voice ID's verdict together mark a turn as two voices: it's treated as conversation, and that person's look doesn't open a talk. Your own voice never counts as the second."
when = "Turn it on if it answers two friends talking in front of it."
needs = "Face presence on and enrolled, and Voice ID."

[s."voice.listen.tap_to_talk"]
tip = "A tap on an add-on's device (the Body face) opens the conversation, as its name would."
what = "No face is needed for that turn, and Voice ID's rules for others still apply. A tap while it speaks stays a stop. The add-on has its own switch too."
when = "Turn it off if taps open conversations you didn't mean."
needs = "Voice listening, and an add-on that offers it."

[s."voice.listen.after_talk"]
tip = "When a talk at the desk ends, its text goes where a call's does: transcripts, open threads, a line in the day's note."
what = "Your turns and its answers as text (never sound, never anyone else's turns). With Phone calls on they're kept with the call transcripts (forgotten like them, with their gist); \"I'll send it tonight\" opens a thread; the day's note gets the time and the count of your turns under \"Desk talks\". The AI's look back after calls doesn't run for these."
when = "Turn it off to keep desk talks out of the transcripts, threads and your daily note."
cost = "Nothing leaves this computer."
