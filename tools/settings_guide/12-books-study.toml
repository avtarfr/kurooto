title = "Books, study time and handwritten notes"
page = "books-and-study.md"
intro = """Books and PDFs read overnight into text your AI can cite, the mix of sources (your notes, books, class
material) that goes into answers, the study tracker that counts time per subject, and handwritten pages written out
as notes. Reading happens at night on the charger and carries on the next night."""
cost = "Reading happens on this computer unless an entry says otherwise. The study tracker keeps minutes per subject only, never window titles."

[parent."sources.cap"]
tip = "The most characters each kind of source may put into one answer."

[s."books.folder"]
tip = "Your own folder for books, with a subfolder per subject."
values = "A full folder path; empty: `files.folder`, else Kurooto's own."
when = "Point it at where you already keep your PDFs; `/books folder` says where to drop them."
needs = "Books and PDFs."

[s."books.at"]
tip = "When the night's book reading begins (on the charger)."
when = "Move it to after you've gone to bed; it reads only on the charger."
needs = "Books and PDFs."

[s."books.until"]
tip = "When the night's reading stops; it carries on the next night from that page."
values = "A time `HH:MM`."
when = "Move it earlier if the computer's fan wakes you; later for big backlogs."
needs = "Books and PDFs."

[s."books.yield_to_owner"]
tip = "The night's reading waits while you're in a Voice turn (heard, answered or spoken), then carries on."
when = "Turn it on if a local reading model slows Voice down on this computer."
what = "Only while the turn lasts; the night's end moves by the wait, so every page still gets its turn that night."
needs = "Books and PDFs, and Voice (it only waits for a Voice turn)."

[s."books.max_mb"]
tip = "PDFs bigger than this (MB) are left alone."
when = "Raise it for big scanned books; they take several nights."
needs = "Books and PDFs."

[s."books.ocr"]
tip = "Who reads scanned pages: Tesseract, a vision model on this computer, either, or nobody."
when = "Pick `vision` for maths-heavy scans (equations come out as LaTeX) if you have a graphics card; `off` to skip scanned pages."
needs = "Books and PDFs; Tesseract or Local AI models installed for those choices."

[s."books.ocr_lang"]
tip = "Tesseract's languages for scanned pages, e.g. `eng+deu`."
values = "Tesseract language codes joined by `+`; each needs its language data installed."
when = "Add the languages your books are in."
needs = "`books.ocr` using Tesseract."

[s."books.latex"]
tip = "Which pages the vision model reads for LaTeX: only ones whose maths came out in pieces, all, or never."
when = "Pick `all` for heavy maths books (slower); `never` to save time."
needs = "A vision model (Local AI models, graphics cards from 8 GB)."

[s."books.dpi"]
tip = "How sharp the page pictures are for reading scanned pages."
when = "Raise it for small print (slower, more disk while reading); lower it for speed."
needs = "Books and PDFs."

[s."books.gemini"]
tip = "Pages nothing on this computer can read go to Google's Gemini as pictures."
when = "Turn it on only if your scans are unreadable here and you're fine with those pages going to Google."
cost = "Those page pictures go to Google with your Gemini key (free limit)."
needs = "A Gemini key."

[s."books.gemini_model"]
tip = "Which Gemini model reads scanned book pages, when `books.gemini` is on."
values = "A Gemini model name."
when = "Change it when a better or cheaper vision model is out."
cost = "Page pictures go to Google with your key."
needs = "`books.gemini`."

[s."books.brain"]
tip = "Index each book's text into the notes brain, so search by meaning finds it."
when = "Turn it off to keep books out of the notes brain's search."
needs = "The Notes brain (GBrain)."

[s."books.brain_source"]
tip = "Which notes-brain source the book text goes into; empty is the default one."
values = "A source name from `gbrain sources list`, or empty."
when = "Only if you run your own GBrain and keep books in a separate source."
needs = "`books.brain`."

[s."books.duplicates"]
tip = "A book that's the same file as one already read is linked to it, not read again."
when = "Turn it off only if you want copies read separately."
needs = "Books and PDFs."

[s."books.after_read"]
tip = "A command of yours run after each book is read, with its subject and id added."
values = "A command as a list: `[\"prog\", \"-x\"]`."
when = "When you want to do something with each new book (copy it, index it elsewhere). It runs as you."
needs = "Books and PDFs."

[s."sources.mix"]
tip = "How much each kind of source counts in answers: your notes, books, class material."
values = "A JSON object of shares adding up to 1: `{\"own\": 0.4, \"book\": 0.3, \"classroom\": 0.3}`."
default = "own 0.4, book 0.3, classroom 0.3"
when = "Give books more weight for theory-heavy subjects, your own notes more where you trust them most. `/books mix` sets it."
cost = "Changes only what goes into a request, not how much."
needs = "Nothing: core. It shapes every request that draws on your notes, books and class material (skills that write course notes, answers that cite them)."

[s."sources.prefer"]
tip = "An order of sources instead of the mix: the first counts most."
values = "A list such as `[\"own\", \"book\", \"classroom\"]` (3:2:1); empty uses the mix."
when = "When you'd rather rank sources than set shares."
needs = "Nothing: core. It shapes every request that draws on your notes, books and class material (skills that write course notes, answers that cite them)."

[s."sources.cap.book"]
tip = "The most characters from books in one answer."
when = "Lower it if book text crowds out your notes; raise it for book-led subjects."
needs = "Nothing: core. It shapes every request that draws on your notes, books and class material (skills that write course notes, answers that cite them)."

[s."sources.cap.classroom"]
tip = "The most characters from class material in one answer."
when = "Lower it if slides crowd out the rest."
needs = "Nothing: core. It shapes every request that draws on your notes, books and class material (skills that write course notes, answers that cite them)."

[s."sources.cap.own"]
tip = "The most characters from your own notes in one answer."
when = "Raise it if answers miss what you wrote yourself."
needs = "Nothing: core. It shapes every request that draws on your notes, books and class material (skills that write course notes, answers that cite them)."

[s."sources.budget"]
tip = "Characters of notes, books and class material in all, per answer."
when = "Raise it for deeper answers (more of your AI's limit per request); lower it to keep requests small."
cost = "More characters means more of your notes go to your AI with each request that uses them."
needs = "Nothing: core. It shapes every request that draws on your notes, books and class material (skills that write course notes, answers that cite them)."

[s."sources.subjects"]
tip = "A different mix or order for one subject."
values = "A JSON object: `{\"linear-algebra\": {\"mix\": {\"book\": 0.6, \"own\": 0.4}}}`."
when = "Use `/books mix` for a subject whose best material is different."
needs = "Nothing: core. It shapes every request that draws on your notes, books and class material (skills that write course notes, answers that cite them)."

[s."study.idle_min"]
tip = "Minutes without activity before study time stops counting."
when = "Raise it if reading on screen without touching anything counts as away."
needs = "The Study tracker."

[s."study.sample_s"]
tip = "Seconds between looks at the window you're working in."
when = "Raise it to look less often (rounder counts); lower it for exact minutes."
needs = "The Study tracker."

[s."study.keywords"]
tip = "Extra words per subject that count a window for it."
values = "A JSON object: `{\"linear-algebra\": [\"matrix\", \"eigen\"]}`."
when = "Add words that show up in your windows for a subject but aren't its name."
needs = "The Study tracker."

[s."study.research_paths"]
tip = "Words or folders whose windows count as Research time."
values = "A list of words or folder names."
when = "Add your project folders so time there isn't lost."
needs = "The Study tracker."

[s."study.daily_note"]
tip = "When the day's study hours go into your daily note; none: never."
values = "A time `HH:MM`, or none."
when = "Move it to just before you stop for the day."
needs = "The Study tracker."

[s."study.focus_min"]
tip = "Study mode's timer: minutes of focus (calls and messages wait, the time is logged)."
when = "Set it to the length you focus well for."
needs = "The Study tracker; Study mode on the dashboard."

[s."study.break_min"]
tip = "Minutes of break the Study mode timer gives after each focus session."
when = "Set it to the break you actually take."
needs = "The Study tracker; Study mode on the dashboard."

[s."study.timer_ends_mode"]
tip = "When a focus ends, Study mode ends too, instead of starting a break."
when = "Turn it on if you use one focus session at a time."
needs = "The Study tracker; Study mode on the dashboard."

[s."study.seen"]
tip = "Let an add-on add minutes it saw you on a subject's topic, kept apart as \"seen\"."
what = """For a window that doesn't name the subject itself (a paper titled after one of the subject's concept notes,
say), an add-on may hand over the subject and a number of seconds, never a title. They count in your totals, and
/study says how much of the day was seen that way. Never while a study session or Study mode's focus runs."""
when = "Turn it off to count only the tracker's own windows, your sessions and what you log."
cost = "Nothing."
needs = "The Study tracker, and an add-on that offers seen minutes."

[s."study.face"]
tip = "Face presence helps the tracker: \"on paper?\" when it sees you without typing, a pause offer when you step away in a focus."
when = "Turn it on if paper study goes uncounted. Nothing is counted or paused without your tap."
needs = "The Study tracker and Face presence."

[s."study.places"]
tip = "Arriving at a place you saved in the phone app offers a study session there; leaving ends one that offer started."
when = "Turn it on if you study at a library or a lab. The place's name stays on this computer."
needs = "The Study tracker and the phone's places sense (Brain)."

[s."study.places_labels"]
tip = "The places (their names in the phone app) where an arrival offers a session; empty: any you saved."
values = "A list of names, e.g. library, lab."
when = "Set it so home doesn't offer a session."
needs = "study.places."

[s."study.notes_workflow"]
tip = "\"Study notes from my upload\" as one request: read the scan, build a study pack, write, compile and file the PDF."
what = "Your AI gets the tools for it (find_uploads, read_handwritten, build_study_pack, save_course_file, study_progress), the skill `/study-notes-from-upload`, and \"make notes from my <course> notes from <topic>\" runs it. The PDF and the .tex go to the course's files folder with a source note linking them, never the notes' top folder."
when = "Turn it off if you don't want the AI reading scans or filing documents for you."
cost = "What any request to your AI sends: the transcription and the pack's text. Reading the scan follows Handwritten notes' own settings."
needs = "Skills; Handwritten notes for the reading."

[s."handwritten.folder"]
tip = "Where scans of handwritten pages land to be read."
values = "A full folder path; empty: `handwritten-inbox` in your notes (or your files folder)."
when = "Point it at the folder your scanner app saves into."
needs = "Handwritten notes."

[s."handwritten.into"]
tip = "Where the written-out notes go, inside your notes folder."
values = "A folder inside your notes; empty: your layout's `handwritten/`."
when = "Pick the folder you want them in."
needs = "Handwritten notes."

[s."handwritten.every"]
tip = "How often the handwritten-notes folder is checked for new scans."
when = "Shorten it if you want notes sooner after scanning."
needs = "Handwritten notes."

[s."handwritten.local"]
tip = "A model on this computer reads the pages when there is one."
when = "Turn it off to always use Gemini (if `handwritten.cloud` is on)."
cost = "Nothing leaves: read here."
needs = "Handwritten notes and Local AI models with a model that reads pictures."

[s."handwritten.local_model"]
tip = "An Ollama model of your choice that reads pictures; empty uses Local AI models' pick."
values = "An Ollama model name."
when = "When you know a model that reads your handwriting better."
cost = "Downloaded from Ollama's registry once."
needs = "`handwritten.local`."

[s."handwritten.cloud"]
tip = "With no model on this computer, Gemini reads the pages; off, they wait for a model here."
when = "Turn it off to keep your handwriting on this computer."
cost = "Page pictures go to Google with your Gemini key."
needs = "Handwritten notes, a Gemini key."

[s."handwritten.model"]
tip = "Which Gemini model reads handwriting when it's used."
values = "A Gemini model name."
when = "Change it when a better vision model is out."
cost = "Page pictures go to Google with your key."
needs = "`handwritten.cloud`."

[s."handwritten.pdf_hours"]
tip = "When the model on this computer reads PDFs (on the charger); empty: any time."
values = "`HH:MM-HH:MM`, or empty."
when = "Empty it if you want PDFs read straight away and the computer can take it."
needs = "`handwritten.local`."

[s."handwritten.max_pages"]
tip = "The most pages written out per PDF."
when = "Raise it for long notebooks."
needs = "Handwritten notes."

[s."handwritten.dpi"]
tip = "How sharp the pictures of handwritten pages are when they're read."
when = "Raise it if small handwriting is misread; lower it for speed."
needs = "Handwritten notes."

[s."handwritten.keep_original"]
tip = "Keep a copy of the scan next to the note, or link to where it already is."
when = "Pick `link` if your scans already live somewhere tidy and you don't want copies."
needs = "Handwritten notes."

[s."handwritten.link"]
tip = "Link each written-out note to its lecture, course page and concept notes."
when = "Turn it off to save one AI request per note."
cost = "One AI request per note, with the note's text."
needs = "Handwritten notes."

[s."handwritten.overlap"]
tip = "Mark the sections of a written-out note that your notes for its course already have, and list what's new."
what = "After linking, one AI request compares each section with the course's folder, its earlier handwritten notes and the concept notes: a covered section's heading gets \"(already in [[note]])\", and the note gets an \"Already in your notes\" and a \"New here\" list. Only Kurooto's parts of the new note change."
when = "Keep it on when someone sends you full notes that repeat yours; turn it off to save the request."
cost = "One AI request per note, with the note's text and the titles, openings and headings of the notes it may repeat."
needs = "Handwritten notes and an AI."

[s."handwritten.overlap_courses"]
tip = "Only these courses' handwritten notes are checked for overlap; empty: every course."
values = "A list of courses (slug, name or short name), or empty."
when = "List the courses where a friend's notes repeat yours, so the rest cost nothing."
needs = "`handwritten.overlap`; a note's course comes from linking (or `course:` in its header)."

[s."handwritten.only_from"]
tip = "\"Only from <topic>\": add the part of a note from that heading on (a .txt next to the scan, its name, or /handwritten only)."
when = "Turn it off if your scans' names say \"from ...\" for another reason."
needs = "Handwritten notes."
