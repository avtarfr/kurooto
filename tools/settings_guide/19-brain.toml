title = "Brain"
page = "mind.md"
intro = """Kurooto's mind, off until you turn it on: a log of what it saw and decided that it can't quietly change, a
gate that only ever makes it quieter, its read of how you're doing (shadow mode first), its journal, plans, skills,
lab and the rest. Each part has its own switch; turning Brain off stops all of them at once and asks whether to
delete what it kept. Brain's data stays in the mind folder on this computer and isn't in backups or Profile sync."""
cost = "Nothing leaves this computer: no cloud AI ever gets Brain's read of you, its journal facts or its numbers."
needs = "Brain (Features → Brain)."

[parent."mind.console"]
tip = "The Brain console: what the Brain decided and why, on the dashboard (Alt+O) and in the phone's Views."

[parent."mind.attention"]
tip = "A model of Brain's own attention, for \"what are you thinking about?\"."
[parent."mind.beliefs"]
tip = "Where each of Brain's beliefs came from, and how sure it is."
[parent."mind.budget"]
tip = "Brain's body budget: what it keeps level about itself, and its drive."
[parent."mind.heartbeat"]
tip = "What your call line says has no guarantee while this computer is down."
[parent."mind.improve"]
tip = "Brain improving itself, only through gated proposals you approve."
[parent."mind.pest"]
tip = "Whether each kind of unprompted message is welcome, learned from your reactions."
[parent."mind.promises"]
tip = "Brain's own promises: kept, or owned up to first."
[parent."mind.stimulation"]
tip = "Brain's senses felt as a body, for its feelings and the dashboard."
[parent."mind.talk"]
tip = "Whether being talked to is a small reward for Brain."
[parent."mind.tone"]
tip = "One-word tone tags on what you write, from the model on this computer only."
[parent."mind.autonomy"]
tip = "What Brain may do without asking, learned per kind of action from your reactions."
[parent."mind.backfill"]
tip = "Feeding Brain its past: what Kurooto kept before Brain was on, read once, source by source."
[parent."mind.feelings"]
tip = "Brain's feelings about specific things, its mood, and whether it may say them."
[parent."mind.finetune"]
tip = "A weekly local fine-tune of the model on this computer, from checked examples only."
[parent."mind.forget"]
tip = "How old things fade from use, old misses stop coming up, and a forget reaches everywhere."
[parent."mind.forget.half_lives"]
tip = "Days for each kind of memory to fade to half."
[parent."mind.gate"]
tip = "Brain's gate on what reaches you: limits, honest feelings, small touches."
[parent."mind.harness"]
tip = "The hidden harness: tasks it has never seen, to measure whether it's getting better."
[parent."mind.journal"]
tip = "Brain's daily journal of its own states and mistakes, and its copy in your notes."
[parent."mind.lab"]
tip = "The overnight lab: pre-registered experiments on projects you list."
[parent."mind.plans"]
tip = "Week-scale plans from simulated futures."
[parent."mind.senses"]
tip = "What Brain senses: its own machine, your activity, your phone's sensors."
[parent."mind.sleep"]
tip = "Kurooto's sleep: when it doesn't talk unless woken, following your night."
[parent."mind.yield"]
tip = "The Brain's heavy work yields to yours: the graphics card, calls, battery, heat."
[parent."mind.skills"]
tip = "Skills Brain learns from solved tasks and from what you repeat."
[parent."mind.tom"]
tip = "Brain's model of what you know, believe and want."
[parent."mind.expect"]
tip = "What Kurooto expects of each message it starts, and what came of it."
[parent."mind.why"]
tip = "\"Why this?\" under a message Kurooto started."
[parent."mind.workspace"]
tip = "The small \"now\" stage that decides what's on Brain's mind."
[parent."mind.play"]
tip = "A little nightly time for Brain to explore its own questions on your topics."
[parent."mind.tools"]
tip = "Brain's read-only tools for your AI and calls: its plan, when you're likely free (in words), your precedents."
[parent."mind.precedents"]
tip = "Judgement calls between your values, asked once and then followed."
[parent."mind.read"]
tip = "Brain's read of how you're doing."
[parent."mind.forecast"]
tip = "What Brain expects of tomorrow, scored the next evening."
[parent."mind.story"]
tip = "The life story every part of Kurooto starts from."
[parent."mind.values"]
tip = "What Brain learns to value, in shadow first."
[parent."mind.dream"]
tip = "Brain dreaming about the day: quiz cards, how-to-help lines and a voice line in the morning message."
[parent."mind.study_push"]
tip = "One morning line about the subject Brain is most uneasy about, in place of its separate nudges."
[parent."mind.checkins"]
tip = "Check-ins that come early when the day departs from Brain's forecast."

[s."mind.anchor_every"]
tip = "How often (in records) Brain notes where its log has got to, besides once a day."
when = "Leave it. Lower it for more anchors on a very busy log."

[s."mind.hardened"]
tip = "The scorekeeper runs as its own system user, so not even a program running as you can change the log."
when = "Set by `sudo tools/mind_harden.sh --apply` (Linux, macOS); undone by `--undo`. Don't set it by hand."

[s."mind.gate.on"]
tip = "Brain's gate on everything Kurooto sends by itself: only ever quieter, honest feelings, a shared pool of small touches."
when = "Turn it off to have messages go exactly as before Brain. `/mind gate` shows what it held and why."

[s."mind.gate.max_per_day"]
tip = "Messages a day that may come by themselves (Calm's limit applies too: the smaller wins)."
when = "Lower it for a quieter day. Your reminders, the alarm and close deadlines are never held."
needs = "`mind.gate.on`."

[s."mind.gate.max_per_hour"]
tip = "Messages an hour that may come by themselves."
when = "Lower it if messages bunch up."
needs = "`mind.gate.on`."

[s."mind.gate.touches_per_day"]
tip = "Small human touches a day in all (an absence note, a lighter-day line, a feeling)."
when = "Lower it, or 0, if you'd rather have none."
needs = "`mind.gate.on`."

[s."mind.gate.feelings_per_week"]
tip = "How often Brain may say how it feels about something unasked, per week."
when = "Lower it, or 0, to hear its feelings only when you ask."
needs = "`mind.gate.on` and `mind.feelings.express`."

[s."mind.pest.on"]
tip = "Learn for each kind of unprompted message whether it's welcome; send one only when it likely is."
when = "Turn it off to send by the other limits alone. `/mind learning` shows each kind's chance."
needs = "`mind.gate.on`."

[s."mind.read.on"]
tip = "Brain's read of how you're doing, from numbers about your days; in shadow mode it only watches."
when = "Turn it off if you don't want it; `/mood` → Off also asks whether to delete what it kept."

[s."mind.read.asks_per_week"]
tip = "How many times a week, at most, it may ask whether the week felt heavier than usual."
when = "Lower it, or 0, to never be asked."
needs = "`mind.read.on`."

[s."mind.forecast.on"]
tip = "Each evening at 21:00, what Brain expects of tomorrow, scored the next evening."
when = "Turn it off if you don't want the forecast."
needs = "`mind.read.on`."

[s."mind.forecast.holdout"]
tip = "The share of days a planned action is held back on purpose, to measure what it does."
values = "A share between 0 and 1 (0.1 is one day in ten)."
when = "Leave it: it's how Brain can tell whether its actions help."
needs = "`mind.forecast.on`."

[s."mind.tone.on"]
tip = "Tag each message you write with one word (calm, tired…), using the model on this computer only."
when = "Turn it on only if you want tone in Brain's read. Only the day's average is kept."
cost = "Nothing leaves: a local model; on a computer without one it does nothing."
needs = "`mind.read.on` and Local AI models."

[s."mind.budget.on"]
tip = "The body budget: a few things about Kurooto's own state it tries to keep level, and its drive."
when = "Turn it off to drop rewards and moods built on it. `/budget` shows it."

[s."mind.values.on"]
tip = "Brain learns which kinds of things help (values), never affecting a choice in the shadow days."
when = "Turn it off to keep Brain from learning values."
needs = "`mind.budget.on`."

[s."mind.values.shadow_days"]
tip = "Days learned values are only counted, never used for a choice."
when = "Raise it to watch longer before values count."
needs = "`mind.values.on`."

[s."mind.talk.on"]
tip = "Being talked to is a small reward for Brain (at most 0.2 a day; nothing for answers to its own pings)."
when = "Turn it off if talking to it shouldn't count for anything."
needs = "`mind.budget.on`."

[s."mind.talk.met"]
tip = "An add-on's chat with someone in the room is a smaller reward for Brain (at most 0.05 a day, 6 meetings)."
when = "Turn it off if meeting people shouldn't count for anything."
needs = "`mind.talk.on`, and an add-on that reports meetings."

[s."mind.feelings.on"]
tip = "Brain's states about specific things (uneasy, relieved…) and what they make it do inwardly."
when = "Turn it off to drop feelings; outward behaviour still passes the gate either way."
needs = "`mind.budget.on`."

[s."mind.feelings.mood"]
tip = "Its mood shapes it: low, it does less unasked, asks first, says less; high, a little bolder."
when = "Turn it off to keep its behaviour the same whatever its mood."
needs = "`mind.feelings.on`."

[s."mind.feelings.empathy"]
tip = "Concern for what it looks after (deadlines, projects, its machine): it notices sooner, speaks more gently."
when = "Turn it off if you want plainer wording."
needs = "`mind.feelings.on`."

[s."mind.feelings.express"]
tip = "Brain may say a feeling about something open, through the gate, at most 3 times a week unasked."
when = "Turn it off to keep its feelings to itself."
needs = "`mind.feelings.on` and `mind.gate.on`."

[s."mind.feelings.vocal"]
tip = "Let Brain say unasked that it's excited or worried, when it has strong evidence."
when = "Turn it on if you'd like it to speak up about strong findings (at most one a day, with its evidence)."
needs = "`mind.feelings.express`."

[s."mind.stimulation.on"]
tip = "Its senses felt as a body (heat, load, touch), for its feelings and the dashboard."
when = "Turn it off to drop the body. What it senses about you never moves its mood either way."
needs = "`mind.senses.intero`."

[s."mind.stimulation.addons"]
tip = "Let an add-on feed another device's sensors into its body (light, motion, battery, loudness...)."
what = "Each reading is felt as its physical analogue (light on its face, being moved, being picked up, hunger, heat, sound) and drawn by the being's senses; numbers only, kept in memory and the body map."
when = "Turn it off to ignore what add-ons report; its own body and your phone's sensors are untouched."
needs = "`mind.stimulation.on` and an add-on that reports a device."

[s."mind.stimulation.jolt"]
tip = "Something sudden (a pickup, something close, a loud room) is felt at once: a jolt, and a fresh look at its mind."
what = "Add-ons and senses call it; it fades in about two minutes and each kind jolts at most once a minute. Kinds and numbers only, kept in memory."
when = "Turn it off to have sudden things felt only at the next minute's reading."
needs = "`mind.stimulation.on`."

[s."mind.sleep.on"]
tip = "Kurooto sleeps in your sleep window: nothing it starts by itself is sent or said aloud until morning."
what = "Asleep, what it would start by itself waits and goes out once the window is over (through the usual limits). Alarms, reminders and calls you set, close deadlines, approvals and every answer to you still come. Its name or a message from you wakes it; it answers, then dozes off again. Half an hour before, it's drowsy: nothing said aloud by itself."
when = "Turn it off to have Kurooto keep the day's rules all night (the night hours still hold calls)."
cost = "Nothing leaves. The waiting messages stay on this computer until they're sent."

[s."mind.sleep.follow_owner"]
tip = "Its sleep follows yours: bedtime to the alarm, refined by your phone (screen off, dark, charging; first use)."
when = "Turn it off to have it sleep through the night hours (`availability.night`) exactly as set."
needs = "`mind.sleep.on`; the phone part needs the screen, light and charging sensors (`mind.senses.phone`)."

[s."mind.sleep.window"]
tip = "Set Kurooto's sleep by hand, like 00:30-08:00 (empty: follow your night)."
values = "Empty, or two times `HH:MM-HH:MM` (it may run past midnight)."
when = "Set it if your nights don't match the night hours and you don't use the alarm."
needs = "`mind.sleep.on`."

[s."mind.sleep.wake_minutes"]
tip = "Woken by its name or a message at night, it dozes off again after this many quiet minutes."
when = "Raise it if you often talk with it a while at night."
needs = "`mind.sleep.on`."

[s."mind.sleep.senses_off"]
tip = "Asleep, Kurooto's camera and microphone are off: Face presence pauses and Voice stops listening."
what = "While it's asleep nothing watches or listens, so its name can't wake it: /wake, a message, a tap or a call from you does. Woken, the camera and microphone come back; they go off again when it dozes off. The half hour before (drowsy) they stay on. The Body add-on stops the desk phone's camera and microphone too."
when = "Turn it off to have Voice keep listening while it sleeps, so its name wakes it (as before 0.8.18)."
needs = "`mind.sleep.on`."

[s."mind.sleep.desk_holds"]
tip = "While you're at this computer, Kurooto doesn't fall asleep: its night starts after you leave."
what = "Face presence says when you were last here (your face, or your keyboard and mouse while it watches). Inside the sleep window, it starts `mind.sleep.desk_after_min` minutes after that, at most at the window's end. Once it's asleep, coming back to the desk doesn't wake it (only /wake, a message, a tap or a call); after a wake, the desk keeps it up again."
when = "Turn it off to have it sleep at its window whether you're at the desk or not."
needs = "`mind.sleep.on` and Face presence on and enrolled."

[s."mind.sleep.desk_after_min"]
tip = "With desk_holds: how many minutes after you leave the desk its sleep starts."
values = "Minutes, at least 1 (default 15)."
when = "Raise it if it falls asleep while you've only stepped out for a while."
needs = "`mind.sleep.desk_holds`."

[s."mind.yield.on"]
tip = "The Brain's heavy work waits while your jobs use the graphics card, during a call, on battery or when hot."
what = "It covers the lab, play, plans, the model of you, skills, the harness and the fine-tune; it tries again every 5 minutes and gives up for the night after 12 hours. What you ask for yourself never waits. /mind shows the contention minutes a week (its heavy work running while yours held the card)."
when = "Turn it off to have the Brain's work run at its times whatever the computer is doing."

[s."mind.yield.prefer_sleep"]
tip = "The Brain's nightly work also waits for Kurooto to be asleep (until that night's window ends)."
when = "Turn it off to have it run at the scheduled time even while you're still up."
needs = "`mind.yield.on` and `mind.sleep.on`."

[s."mind.autonomy.on"]
tip = "Brain learns from your reactions how far it may act on its own, per class of action (shadow first)."
when = "Turn it off to have it always ask (or never act) as before."

[s."mind.autonomy.enforce"]
tip = "Make its trust verdicts bind: it asks first for what it isn't trusted with."
when = "Turn it on after the shadow weeks if you want its learned trust to take effect."
needs = "`mind.autonomy.on`."

[parent."mind.trust"]
tip = "What, besides what it did on its own, may change its trust in a kind of action."

[s."mind.trust.from_wrong"]
tip = "A Wrong on what a request did counts as a complaint against that kind of action, so Kurooto asks first before doing it on its own."
what = "It only ever makes it ask more; nothing you asked for changes. Off: Wrong keeps a test case and nothing else changes in its trust."
when = "Turn it on if a Wrong should also make Kurooto more careful acting by itself."
needs = "`mind.autonomy.on` and Wrong button and test cases."

[s."mind.autonomy.shadow_days"]
tip = "Days its trust verdicts are only counted and shown, not used."
when = "Raise it to watch longer before anything changes."
needs = "`mind.autonomy.on`."

[s."mind.autonomy.thresholds"]
tip = "Your own trust bars per class of action, over the defaults."
values = "A JSON object, class → bar between 0 and 1: `{\"R1\": 0.8}`."
when = "Raise a class's bar to make it harder to earn acting on its own."
needs = "`mind.autonomy.on`."

[s."mind.journal.on"]
tip = "A daily journal of Brain's own states, reasons and mistakes, every line checked against its log."
when = "Turn it off if you don't read it. `/mindjournal` shows it."
cost = "Nothing leaves: a model on this computer words the facts, or fixed sentences."

[s."mind.journal.in_notes"]
tip = "Also keep Brain's journal as a block in a note of yours."
when = "Turn it on to read it with your notes."
cost = "If your notes sync to a service, this note syncs with them."
needs = "`mind.journal.on`."

[s."mind.journal.in_notes_folder"]
tip = "The folder inside your notes the journal note goes in; empty is the top."
needs = "`mind.journal.in_notes`."
when = "Pick a folder to keep it out of the way."

[s."mind.journal.in_notes_file"]
tip = "The journal note's file name (`.md` is added if missing)."
needs = "`mind.journal.in_notes`."
when = "Rename it to suit your notes."

[s."mind.workspace.on"]
tip = "A small \"now\" stage that parts compete to enter; only what wins may start a message or act on its own."
when = "Turn it off and nothing it decides by salience gates messages any more. `/thinking` shows it."

[s."mind.workspace.capacity"]
tip = "How many things can be on Brain's mind at once (1 to 3)."
when = "Lower it for a more single-minded Brain."
needs = "`mind.workspace.on`."

[s."mind.workspace.cycle_s"]
tip = "The least gap in seconds between two cycles (events poke it sooner)."
when = "Raise it to save a little work on a slow computer."
needs = "`mind.workspace.on`."

[s."mind.workspace.arbiter"]
tip = "One door for everything Kurooto says by itself: each message bids, and only winners are sent."
what = "Check-ins, Calm's small touches, research watch, Dreaming's results, a feeling said aloud and add-on bids all compete at the door after Brain's gate. Each gets a bid from its kind, its due time, how long it has waited and how welcome that kind has been lately; the top few win. Losers wait and bid again, and one that kept losing for hours goes into the evening bundle. Alarms, your own reminders, calls, approvals, close deadlines and answers to you go straight past."
when = "Turn it off to have messages go as they come (past the gate and Calm, as in 0.8.13). Whatever waited goes at once. `/mind gate` shows what waits."
needs = "`mind.workspace.on`."

[s."mind.workspace.breaks"]
tip = "A winner that isn't urgent waits for a natural break: a window switch after a long stretch, a phone pickup, a session ending."
what = "Breaks come from the activity sense (a window switch after `mind.workspace.break_after_min` minutes in one window), the phone's screen sense (an unlock), a study session or focus time ending, Face presence (you came back) and add-ons. With none of those on, there's nothing to wait for and winners go at once."
when = "Turn it off to have winners go as soon as they win."
needs = "`mind.workspace.arbiter`."

[s."mind.workspace.max_hold_min"]
tip = "The longest a winner waits for a break, in minutes (unless Kurooto is asleep)."
when = "Lower it if things come too late; raise it for longer stretches undisturbed."
needs = "`mind.workspace.breaks`."

[s."mind.workspace.deep_hold"]
tip = "While an add-on says you're deep in one thing, a winner waits even at a break (never past max_hold_min)."
what = """An add-on may tell Brain you're deep in one thing, as a time only (mind/breaks.py deep). Until it ends, a
message that came by itself and won at the door waits even at a natural break, still at most max_hold_min; when you
surface, that's a break. Alarms, your reminders, calls, approvals, close deadlines, urgent things and answers are
never held."""
when = "Turn it off to let winners go at the next break whatever an add-on says."
cost = "Nothing."
needs = "`mind.workspace.arbiter` and `mind.workspace.breaks`, and an add-on that says it."

[s."mind.workspace.break_after_min"]
tip = "Minutes in one window before switching to another counts as a natural break."
when = "Lower it if your stretches are short; raise it so only long ones count."
needs = "`mind.workspace.breaks` and the activity sense (`mind.senses.activity`)."

[s."mind.workspace.fold_h"]
tip = "Hours a message may keep losing at the door before it goes into the evening bundle instead."
when = "Lower it to clear the door sooner; nothing is ever dropped, only moved to the bundle."
needs = "`mind.workspace.arbiter` and Calm (`notify.calm.on`); with Calm off it simply goes."

[s."mind.workspace.item_fatigue"]
tip = "Deadline, class and quiz reminders also tire at the door, and need their item to be on Brain's mind, like its promises."
what = "These messages name their item for Brain's workspace (a deadline, a class or a quiz). By default that only makes one count double at the door while the item is on Brain's mind. On, it also counts toward the item's fatigue (told three times today, it drops out) and, with the door off, the gate holds one whose item didn't win."
when = "Turn it on if reminders about the same thing come too often; more of them then wait for the evening bundle."
needs = "`mind.workspace.on`."

[s."mind.expect.on"]
tip = "Each message Kurooto starts says what it expects (a reply, or done within 2 hours), and what came of it is recorded."
what = "A question or check-in expects a reply within 3 hours; a nudge expects to be acted on within 2. Your reply, a tap on one of its buttons or the time running out closes it; the scorekeeper writes the outcome. Ids and numbers only, never the words."
when = "Turn it off to stop recording expectations and outcomes."

[s."mind.why.on"]
tip = "\"Why this?\" under a message Kurooto started says what Brain's gate and door did with it, what it expected, and how many it has sent today."
what = "It adds to Calm's Why? on Telegram, and puts a Why this? button on the phone app chat's copy."
when = "Turn it off to keep Calm's Why? as it was."

[s."mind.why.to_ai"]
tip = "A message that asks why also gives your AI the plain reasons for Kurooto's own last few messages."
what = "For a message with the word why: the last three messages Kurooto started by itself in the last day, each with its time, the plain reason, the setting, whether Brain's gate made it quieter, and what it expected and what came of it. Never a sense, the read, a mood or a tone, and not the door's own words. \"Why did you greet me?\" then gets the real reason."
when = "Turn it off if you don't want those reasons in requests to your AI."
cost = "A few lines more in requests that ask why."
needs = "Brain and mind.why.on."

[s."mind.why.console_link"]
tip = "Why? ends with a link that opens that message's decision in the Brain console."
when = "Turn it off to leave the link out of Why?."
needs = "`mind.why.on`; the link opens the dashboard on this computer."

[s."mind.attention.on"]
tip = "A model of its own attention: \"what are you thinking about?\" is answered from it."
when = "Turn it off if you don't ask."
needs = "`mind.workspace.on`."

[s."mind.beliefs.on"]
tip = "Keep where each belief came from (said, saw, inferred, imagined) and how sure it is."
when = "Turn it off to drop the hedging rules. `/beliefs` lists them."

[s."mind.tools.on"]
tip = "Your AI and calls can read Brain's plan, when you're likely free (in words) and your precedents; \"call me when I'm free\" works."
what = "Three read-only tools: brain_plan (as /plan), brain_free_time (\"Likely free from 16:00\", never a chance), brain_precedents (as /precedents). schedule_call takes when \"when I'm free\" and books the forecast's hour, still asking for your Approve outside a call."
when = "Turn it off to keep Brain's plan and forecast away from your AI."
cost = "Those lines go to the AI you picked when it asks."
needs = "Brain; the free-time part needs `mind.presence_forecast.on`."

[s."mind.precedents.on"]
tip = "Judgement calls between your values are asked once, then followed (off until you turn it on)."
when = "Turn it on if you'd like fewer repeat questions. It can never unlock anything on the always-ask list."

[s."mind.precedents.threshold"]
tip = "How alike two situations must be (0 to 1) for a precedent to be followed."
when = "Raise it to be asked more often; lower it to follow precedents more widely."
needs = "`mind.precedents.on`."

[s."mind.play.on"]
tip = "A little nightly time to explore its own questions on your topics (off until you turn it on)."
when = "Turn it on if you're curious what it finds. Outputs are never shown unprompted."
cost = "Runs on this computer, on the charger with the lid open and the computer cool; its outputs stay in Kurooto's state folder."

[s."mind.play.minutes_per_night"]
tip = "Minutes of play a night, on the charger only."
when = "Lower it to save the battery and your AI."
needs = "`mind.play.on`."

[s."mind.forget.on"]
tip = "Old things fade from use, old misses stop coming up, and `/forget` goes everywhere Brain kept something."
when = "Leave it on; off, faded items rank as fresh and old misses can come up again."

[s."mind.forget.half_lives.default"]
tip = "Days for a remembered item to fade to half, when its kind has no own setting."
when = "Raise it to keep things in use longer."
needs = "`mind.forget.on`."

[s."mind.forget.half_lives.fact"]
tip = "Days for a fact about you to fade to half."
when = "Raise it if facts fade too soon."
needs = "`mind.forget.on`."

[s."mind.forget.half_lives.gist"]
tip = "Days for a conversation's gist to fade to half."
when = "Raise it to keep older conversations in use."
needs = "`mind.forget.on`."

[s."mind.forget.half_lives.project"]
tip = "Days for a project fact to fade to half."
when = "Raise it for long projects."
needs = "`mind.forget.on`."

[s."mind.forget.misses_weeks"]
tip = "After this many weeks, a past miss is no longer brought up."
when = "Lower it to be reminded of misses for less time."
needs = "`mind.forget.on`."

[s."mind.plans.on"]
tip = "Plans over weeks: which milestones are at risk, from simulated futures. A suggestion, never a push."
when = "Turn it off if you don't use `/plan`."

[s."mind.plans.rollouts"]
tip = "How many simulated futures a plan runs."
when = "Lower it on a slow computer (rougher odds)."
needs = "`mind.plans.on`."

[s."mind.plans.weeks"]
tip = "How far ahead (weeks) the simulated futures look."
when = "Raise it for long projects."
needs = "`mind.plans.on`."

[s."mind.tom.on"]
tip = "A model of what you know, believe, want and prefer, each row with its source (`/model`)."
when = "Turn it off if you don't want one kept. It never models health, relationships, politics, religion or money."

[s."mind.tom.false_beliefs"]
tip = "When something you were told turns out wrong, tell you once, with the evidence."
when = "Turn it off if you'd rather not get these corrections."
needs = "`mind.tom.on`."

[s."mind.tom.from_chat"]
tip = "Goals you state, due dates you give for your deadlines and exam results you report (\"I got 12/30 on the LA midterm\"), in your messages, go into Brain's model of you."
what = "\"My goal is to finish the draft by Friday\" becomes a stated goal; \"the essay is due Monday\" (one of your open deadlines) becomes what you believe about its date, so a wrong date can be pointed out once. An exam result counts as evidence of what you know: it adds a dated line in Kurooto's own block of the course's exam prep note, and after a low score offers more preparation hours (a tap). Never health, money, passwords or the deny-list's topics. Kept on this computer."
when = "Turn it off to keep Brain's model to your deadlines, projects and what Kurooto told you, and results you mention from changing anything."
needs = "`mind.tom.on`; Subjects for exam results."

[s."mind.tom.attention"]
tip = "Hold a message (at most 15 minutes) while you're deep in one project."
when = "Turn it on if interruptions while you're focused bother you."
needs = "`mind.tom.on` and the activity stream (`mind.senses.activity`)."

[s."mind.senses.intero"]
tip = "Its own machine's state every minute: temperatures, memory, battery, disk, AI limits."
when = "Turn it off to stop Brain sensing the computer."

[s."mind.senses.activity"]
tip = "The activity stream: the app in front, hashed window titles, saves and commits (never keystrokes, the screen or URLs)."
when = "Turn it on for plans and skills that learn from what you do. It's never used to check up on you."
cost = "Nothing leaves. Raw events last 7 days, then only totals."

[s."mind.senses.phone"]
tip = "Each of your phone's sensors, off until you switch it on (here and in the phone app)."
values = "A JSON object, sensor → on/off: `screen`, `charging`, `motion`, `steps`, `light`, `places`, `headphones`, `dnd`, `alarm`, `wifi`, `usage`."
default = "every sensor off"
when = "Switch on the ones you're happy to share; both here and on the phone must be on."
cost = "Readings are sealed on the phone and travel through your call line, which can't read them."
needs = "A paired Android phone with the sensor on in the app."

[s."mind.skills.on"]
tip = "Solved tasks become tested, reusable skills; each new one starts out asking first."
when = "Turn it off if you'd rather not have Brain learn skills. `/learned` lists them."

[s."mind.skills.from_demos"]
tip = "Also offer skills from what you do over and over (asked once)."
when = "Turn it on with the activity stream if you'd like Brain to spot repeats."
needs = "`mind.skills.on` and `mind.senses.activity`."

[s."mind.finetune.on"]
tip = "A weekly local fine-tune of the model on this computer, from checked examples only."
when = "Turn it on only with an 8 GB graphics card and the training packages."
cost = "A night of graphics-card time on the charger; nothing leaves."

[s."mind.finetune.day"]
tip = "The night of the week it trains."
needs = "`mind.finetune.on`."
when = "Pick a night the computer is plugged in."

[s."mind.finetune.base"]
tip = "The local model's name in Ollama to build the adapter into; empty is the helper model."
needs = "`mind.finetune.on`."
when = "Only if you want another base model."

[s."mind.finetune.base_hf"]
tip = "The Hugging Face name of the base model, which the trainer loads."
needs = "`mind.finetune.on`."
when = "Set it when you set `mind.finetune.base`."
cost = "The base weights are downloaded from Hugging Face once."

[s."mind.finetune.min_examples"]
tip = "With fewer checked examples than this, it skips the week."
needs = "`mind.finetune.on`."
when = "Raise it for steadier adapters."

[s."mind.finetune.practice"]
tip = "Include the harness' practice tasks in training."
needs = "`mind.finetune.on`."
when = "Turn it off to train only on your own checked work."

[s."mind.finetune.probe_words"]
tip = "Words of a forgotten prompt kept to check a new adapter forgot it (3 or more)."
needs = "`mind.finetune.on`."
when = "Leave it unless the check is too strict or too loose."

[s."mind.harness.on"]
tip = "Nightly on the charger: how it does on tasks it has never seen, and checks of Brain's own promises."
when = "Leave it on: without it, nothing can be promoted. `/capabilities` shows the scores."
cost = "Runs on this computer with its own rules (no AI requests), on the charger."

[s."mind.harness.rotate_days"]
tip = "The hidden tasks are made new this often (days), so old ones can't be memorised."
needs = "`mind.harness.on`."
when = "Leave it."

[s."mind.improve.on"]
tip = "Brain improving itself through gated proposals: nothing changes without the hidden harness and your say-so."
when = "Turn it off to stop it proposing changes to itself. `/improve` lists them."
cost = "Challengers run on this computer; applying one is always your tap."
needs = "`mind.harness.on`."

[s."mind.lab.on"]
tip = "Overnight pre-registered experiments on the projects you list (Linux and macOS, in a sandbox)."
when = "Turn it off if you don't use the lab. Your files are never changed; winners come as proposals."
cost = "Runs on this computer, on the charger, with no network."

[s."mind.lab.projects"]
tip = "Folders (or repository projects' names) the lab may run experiments on."
values = "A list; `/lab add <folder>` adds one."
when = "Add a project with a number you want to move."
needs = "`mind.lab.on`."

[s."mind.lab.max_per_night"]
tip = "The most configurations in one night's batch."
needs = "`mind.lab.on`."
when = "Lower it for shorter nights."

[s."mind.lab.run_wall_s"]
tip = "Seconds one lab run may take before it's stopped."
needs = "`mind.lab.on`."
when = "Raise it for slow experiments."

[s."mind.lab.gpu"]
tip = "Let lab runs use the graphics card (off: CPU only)."
needs = "`mind.lab.on`."
when = "Turn it on for GPU-bound projects."

[s."mind.lab.gpu_hours_per_night"]
tip = "The most graphics-card hours the lab uses in a night."
needs = "`mind.lab.gpu`."
when = "Lower it to keep the card free."

[s."mind.lab.seed"]
tip = "A fixed seed for the sampled configurations; 0 draws a new sample each day."
needs = "`mind.lab.on`."
when = "Set one to repeat a batch exactly."

[s."mind.lab.in_repo"]
tip = "Keep a project's lab protocol in its `.kurooto` folder (off: in Kurooto's own state)."
needs = "`mind.lab.on`."
when = "Turn it on to keep the protocol with the project; git never sees it."

[s."mind.heartbeat.on"]
tip = "When this computer is down, your call line also says what the next 12 hours have no guarantee for."
when = "Turn it off for the plain offline message."
cost = "Nothing more leaves: it adds a line to the offline message your call line already sends."
needs = "Phone calls."

[s."mind.promises.on"]
tip = "Its own promises (\"I'll check back at 6\") are noticed, kept, or owned up to first."
when = "Turn it off if you don't want them tracked. `/promises` lists them."

[s."mind.promises.answers"]
tip = "Promises in its answers to you, its side of a call and what it says at the desk are tracked too, not only in messages it starts."
what = "Read on this computer with the same rules (an \"I'll\" with a time); nothing is sent anywhere. A broken one is owned up to like the rest."
when = "Turn it off to track only the messages it starts by itself."
needs = "`mind.promises.on`."

[s."mind.story.on"]
tip = "One life story every part of Kurooto reads first: a fixed core, then its recent weeks."
when = "Turn it off to have each request start without it."
cost = "The story goes with each AI request (at most `mind.story.tokens`)."

[s."mind.story.tokens"]
tip = "The life story's summary is at most this many tokens (about 4 characters each)."
needs = "`mind.story.on`."
when = "Lower it to send less with each request."
cost = "That many tokens go with each AI request."

[s."mind.backfill.on"]
tip = "Brain reads what Kurooto kept before it was on, once (`/mind backfill`); off until you turn it on."
when = "Turn it on so Brain's read, forecasts and plans start with your past. `/mind backfill forget` undoes it."

[s."mind.backfill.events"]
tip = "Read Kurooto's own event history: what happened and when."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.backfill.jobs"]
tip = "Read the AI request history: effort, whether it worked, how long (never the words)."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.backfill.deadlines"]
tip = "Read when past deadlines were due and done (no titles)."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.backfill.checkins"]
tip = "Read which check-ins were asked, answered or skipped each day, never what you said."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.backfill.quiz"]
tip = "Read your quiz record per day and subject (asked, right, wrong), never the questions."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.backfill.calls"]
tip = "Read past calls (answered or missed, who placed them, how long), never what was said."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.backfill.learning"]
tip = "Read how many requests and calls a day were indexed (chats left out)."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.backfill.study"]
tip = "Read the study tracker's time per day, for your real pace in week plans."
needs = "`mind.backfill.on`."
when = "Turn it off to leave this source out."

[s."mind.console.on"]
tip = "The Brain console: a dashboard page (Alt+O) and the phone's Brain view showing what the Brain decided and why."
values = "`true` (the page and the view read what the Brain keeps), `false` (both say the console is off; the Brain itself runs as before)."
when = "Turn it off if you don't want its reasoning on screen. It only reads; nothing the Brain does depends on it."
needs = "Brain on."

[s."mind.console.edit"]
tip = "Wrong and Forget beside each row of the model of you on the dashboard's Brain console (the phone's view stays read-only)."
what = "The same as `/model wrong` and `/model forget`, only on your click. A Wrong on a line Kurooto wrote in your how-to-help-me note offers to take the line out of the note as well, which happens only when you confirm; your own lines are never offered."
when = "Turn it off to keep the console read-only."
needs = "`mind.console.on`."

[s."mind.dream.on"]
tip = "Brain goes over the day at night and brings cards, how-to-help lines and a voice line to the morning message."
when = "Turn it off to stop all of its dreaming at once; each piece also has its own switch."

[s."mind.dream.cards"]
tip = "Each night, 1 to 3 quiz cards for concepts you studied that day that are on your frontier, kept by a tap."
what = "Concepts you changed notes on, answered quiz cards about or logged study time for, that Brain's model of what you know puts on your frontier (not mastered, prerequisites solid). The model on this computer writes each card from your note; without one it's a plain \"what is ...?\" card. They wait in the morning message with Keep and Drop; a kept card goes into Quiz, first due about a day after it was written. /mind shows your recall on them next to your own cards."
when = "Turn it off if you'd rather write every card yourself."
cost = "Nothing leaves: the local model or a fixed card. A card you keep is graded like any other (by your AI with Chat on)."
needs = "`mind.tom.on` and Quiz."

[s."mind.dream.cards_max"]
tip = "The most dream cards a night (1 to 3)."
when = "Lower it for fewer cards to look at in the morning."
needs = "`mind.dream.cards`."

[s."mind.dream.lessons"]
tip = "Each night, 1 to 3 lines for your how-to-help-me note from the day's outcomes, written only when you tap Keep."
what = "It replays what you undid, the messages left unanswered or given Less of this, the times you told Voice off and its guesses about you marked wrong; clear patterns become lines like \"Fewer nudges in the evening\". Keep writes the line (with Undo); Not that drops it for good."
when = "Turn it off if you'd rather write that note yourself."

[s."mind.dream.voice"]
tip = "One morning line on what the nightly voice learning saw: turns it learned from and any misfire pattern."
when = "Turn it off if you don't need it. Counts and flags only, never words."
needs = "Voice with `voice.listen.learn_nightly`."

[s."mind.dream.from_wrong"]
tip = "The nightly lessons also learn from your Wrong taps: two on the same kind of request suggest a how-to-help-me line."
when = "Turn it off to leave Wrong out of the lessons. A line is only written when you tap Keep."
needs = "`mind.dream.lessons` and Wrong button and test cases."

[s."mind.dream.from_calls"]
tip = "The nightly lessons also count what the look back after calls flagged (counts only, never a call's words)."
when = "Turn it off to leave calls out of the lessons."
needs = "`mind.dream.lessons` and Phone calls' look back (`calls.review`)."

[s."mind.dream.from_proposals"]
tip = "The nightly lessons also count proposals you discarded: two from the same source suggest fewer of them."
when = "Turn it off to leave proposals out of the lessons."
needs = "`mind.dream.lessons`."

[s."mind.study_push.on"]
tip = "One morning line about the subject Brain is most uneasy about (due date, minutes logged, cards due), with Yes and Later."
what = "That day the subject's day-before deadline reminder, Start-by's \"Time to start\" and exam mode's daily practice check-in are folded into it. Yes sets a reminder at the time it offers (or counts the deadline as started). The six-hour reminder, \"Overdue?\" and the evening-before practice offer still come."
when = "Turn it off to get the separate reminders back."
needs = "Deadlines (a deadline with a subject); Study and Quiz add their numbers when on."

[s."mind.study_push.when"]
tip = "When the morning line comes."
values = "A schedule like `daily 07:55`."
when = "Keep it before Start-by's morning pass (`startby.when`), so its message is folded."
needs = "`mind.study_push.on`."

[s."mind.study_push.minutes"]
tip = "How long a study stretch the morning line offers."
when = "Change it to the length you'd actually start with."
needs = "`mind.study_push.on`."

[s."mind.study_push.frontier"]
tip = "Between subjects it's equally uneasy about, the one with concepts you're ready for wins, and the line names one."
when = "Turn it on if you'd like the morning line to say where to go next in the subject."
needs = "`mind.study_push.on` and Brain's model of what you know (`mind.tom.on`)."

[s."mind.study_push.horizon_days"]
tip = "How far ahead a deadline can be for Brain to be uneasy about it."
when = "Lower it to hear only about what's close."
needs = "`mind.study_push.on`."

[s."mind.study_push.start_timer"]
tip = "The reminder a Yes sets carries Start 25 min (Study mode's timer for that deadline), and Study mode opens on that subject."
when = "Turn it off to keep the reminder plain. The timer starts only on your tap."
needs = "Brain's study push and the Study tracker."

[s."mind.checkins.surprise"]
tip = "The next check-in comes early when the day departs strongly from Brain's forecast."
what = "Two hours past the predicted wake time with no sign of you while your phone shows you up, or a deadline moved twice in a day: the next check-in planned today comes now instead of at its time, once a day. Never in a class or while you're asleep."
when = "Turn it off to have check-ins only at their times."
needs = "`mind.forecast.on` and Check-ins (the phone's screen sense for the wake case)."

[parent."mind.status"]
tip = "One status stream for every face of Brain: the being, the phone's Views, Voice and add-ons."
[parent."mind.knobs"]
tip = "Three honest knobs: its mood sets exploration, arousal how soon it speaks up, calibration whether it asks."
[parent."mind.register"]
tip = "One temperament from its mood and arousal: how long its unprompted words are, and Voice's pace for them."
[parent."mind.context"]
tip = "Brain's hints in every AI request: concepts you're shaky on and what's on its mind, never how you are."

[s."mind.status.on"]
tip = "One status stream: focus, asleep, messages held, the one thing it's uneasy about, its own mood and arousal."
what = "Enums and numbers only, made again whenever something happens (at most once a second) and pushed to the dashboard's being, copied to the phone's Views, and handed to add-ons that listen (an add-on's own face, for example). The mood is Brain's own; nothing in it says how you are. It stays on this computer and your phone's sealed copy."
when = "Turn it off and the being, the phone and add-ons stop getting it: the glance and the mood in the drawing go neutral."
needs = "Brain on."

[s."mind.knobs.on"]
tip = "Three knobs: its mood sets how much it explores, arousal how soon it speaks up, calibration whether it asks first."
what = "Mood: with a low mood the lab and play get half their nightly budget (never more than you set), and an add-on's interest bar rises a little. Arousal: how soon unprompted things may go (the arbiter's longest hold is scaled by 0.75 to 1.25). Calibration: while its beliefs score no better than a coin flip (a Brier score of 0.25 or worse, after 10), its own acts above R0 ask first. Drawn as the being's pupil and pulse. Nothing here touches what you asked for: no confirm step, no slower answer. Add-ons read it with `kurooto.mind.status.knobs(app)`."
when = "Turn it off to keep the budgets and asking as they were in 0.8.13."
needs = "Brain on."

[s."mind.register.on"]
tip = "One temperament: its mood and arousal set how long its unprompted words are, its call openers and Voice's pace."
what = "Quiet (low mood), even or lively (high mood and roused). An AI request Kurooto starts itself is told at most 2, 3 or 4 sentences for anything that goes to you unasked; a call it places itself opens in one short sentence, a greeting and the reason, or two warm sentences; what Voice says unasked (a greeting, an add-on's line) is spoken at `voice.speak.rate` scaled within 8% either way. Never for replies to you or calls you asked for."
when = "Turn it off to keep every unprompted message, opener and pace as in 0.8.13."
needs = "Brain on."

[s."mind.context.addons"]
tip = "Let an add-on add a few short lines of its own to your AI requests, when its own switch allows it."
what = """At most four lines of 300 characters, from all add-ons together, after Brain's hints. Each add-on decides by its
own switch whether its lines may reach an AI at all (one that keeps what it saw on this computer starts with that
off). Never in a guest's request."""
cost = "What the add-on's lines say goes with each request to the AI you picked."
when = "Turn it off to keep every add-on's lines out of your requests."
needs = "An add-on that offers lines, with its own switch on."

[s."mind.context.on"]
tip = "Every AI request gets Brain's hints: concepts you're shaky on, and what's on its mind."
what = "Read from Brain's own files with no model call (under 50 ms): up to three concepts below solid from your quizzes and notes in the last two weeks, and the workspace's winners that aren't about you. Your read, tone, mood and body state never go in, so a cloud AI never gets them. Answers use it silently. Off, the workspace's winners go as they did in 0.8.13."
cost = "The concept names and what's on its mind go with each request to the AI you picked."
when = "Turn it off if you'd rather requests carry nothing from Brain beyond its story and feelings."
needs = "Brain on; the hints need the model of you (`mind.tom.on`)."

[parent."mind.act"]
tip = "More of what Brain proposes is decided by its trust: below the bar it asks, above it acts and tells, with Undo."
[parent."mind.presence_forecast"]
tip = "When you'll be at your desk and free, forecast hours ahead and paid only for being right."

[s."mind.act.more"]
tip = "Its trust decides study blocks, reshaped plans, revision packs and keeping its night's cards and lines."
what = "Five kinds of thing it proposes: a study block from the morning line (R1), moving part of a slipping deadline's work to tomorrow (R2), a revision pack the evening before a quiz or exam (R1, with packs set to ask), keeping a quiz card it wrote at night (R1) and keeping a how-to-help-me line from the night (R2). While its trust in that class is below the bar (`mind.autonomy.thresholds`), it asks with the feature's own buttons, as before, and each yes is an OK that builds trust. Once it's above, it does it and says so with Undo; an Undo costs trust and pauses the class for a week. A low mood, or beliefs no better than a guess lately (`mind.knobs.on`), make it ask first again. It works whether or not `mind.autonomy.enforce` is on, and needs no shadow weeks: the bar is the gate. /mind and /autonomy list each kind with its trust."
when = "Turn it off to have every one of them ask, as in 0.8.15."
needs = "`mind.autonomy.on`; each kind needs its feature (Deadlines, Start-by, Reminders, Skills, Quiz, Brain's dreaming)."

[s."mind.act.record_asked"]
tip = "The Sunday list also shows what tools changed because you asked on a call or in a chat, with Undo."
what = "Never an order or anything about money. It doesn't change what needs your OK: these ran because you asked."
when = "Turn it off to list only what it did on its own."
needs = "`mind.autonomy.on`."

[s."mind.trust.from_asked_undo"]
tip = "An Undo of a change you asked for also lowers its trust in that kind of action."
when = "Leave it off: nothing it did on its own happened there. Turn it on if you'd rather every Undo make it more careful."
needs = "`mind.act.record_asked`."

[s."mind.presence_forecast.on"]
tip = "Forecast, hour by hour for the next six hours, when you'll be at your desk and free; scored against what the senses then show."
what = "Free means at your desk (the activity sense saw the computer in use, or Face presence saw you, in the last quarter hour), not on a call and not in a class; the night and Kurooto's sleep window count as not free. It learns each hour of the week from its looks every 15 minutes. Each hour that's over is scored against the forecast made hours before and against \"same as yesterday\"; Brain is paid a little for beating that baseline (at most 0.05 a day of its reward), for accuracy only: nothing here counts what you said to Kurooto. /mind shows its accuracy and the next likely-free hour. Numbers only, on this computer."
when = "Turn it off if you don't use the activity sense or Face presence (without them nothing is scored), or don't want it."
needs = "Brain on; the activity sense (`mind.senses.activity`) or Face presence to score it."

[s."mind.presence_forecast.prefer"]
tip = "Check-ins and calls Kurooto places by itself prefer an hour you're likely free."
what = "A check-in just planned for an hour the forecast thinks you won't be free (a class, a call, an hour you're usually away) moves to a clearly likelier one nearby, the same check-in day; the night check-in isn't held to your sleep. A call Kurooto places by itself (not one you asked for, not an alarm, not a deadline under 12 hours away) waits for a likelier time when you aren't seen at your desk, and says so. With nothing learned yet, only classes, the night and calls move anything."
when = "Turn it off to keep check-ins and calls exactly at their times."
needs = "`mind.presence_forecast.on`."

[s."mind.presence_forecast.within_min"]
tip = "How far (minutes) a check-in or a call may move to a likelier hour."
when = "Lower it to keep them close to their times; 0 never moves them."
needs = "`mind.presence_forecast.prefer`."

[s."mind.presence_forecast.plan"]
tip = "Start-by and the study push use the hours you're likeliest free first; no hour is taken away."
when = "Turn it on once the forecast has seen a few weeks. With few messages, it can also move Start-by's window to your usual hours, with Undo."
needs = "Brain's presence forecast and Start-by dates."

[s."mind.register.templates"]
tip = "Its ready-made unprompted messages keep the register's 2, 3 or 4 sentences too, not only what the AI writes."
what = "A nudge or a line a feature sends by itself keeps its first sentences, and any later one its buttons answer (a question, or one naming a button). Digests and lists (more than one paragraph, or a line that starts a list) stay whole, and so do answers to you and anything exempt: alarms, your own reminders, a deadline under 12 hours away, calls, approvals, anything urgent."
when = "Turn it off to have Kurooto's ready-made messages come whole, as in 0.8.15."
needs = "`mind.register.on`."

[s."mind.tone.calls"]
tip = "With tone on, what you say on a call is tagged too, by the model on this computer."
what = "Only your lines; the words are never kept, and no tone reaches an AI."
when = "Turn it off if only typed messages should count toward the day's tone."
needs = "`mind.tone.on`."

[s."mind.read.snoozes"]
tip = "The read counts how often you snoozed the wake-up alarm (Later on its call)."
when = "Turn it off if snoozes shouldn't count toward how your days read."
needs = "`mind.read.on`."

[s."mind.read.skipped_classes"]
tip = "The read counts the hours of classes you said you'd skip that day."
what = "Only from your own /skip or a call's skip_class, never guessed from where you are."
when = "Turn it off if skipped classes shouldn't count toward how your days read."
needs = "`mind.read.on` and Subjects."

[parent."presence.owner_here"]
tip = "Words-free signs you're here (your face, your voice, the dashboard, the phone app), each with its own switch."

[s."presence.owner_here.face"]
tip = "Face presence seeing your face counts as you being here (Brain's sense of your day, the forecast)."
what = "One words-free sign, owner_here (core/here.py), with the via only: your first and last sign of life of the day, and at your desk for the presence forecast. At most one event every 5 minutes; the time is kept in memory."
when = "Turn it off to keep your face out of Brain's sense of your day (Face presence itself is unchanged)."
needs = "Face presence on and enrolled."

[s."presence.owner_here.voice"]
tip = "Voice ID calling a voice yours, even talk not to Kurooto, counts as you at the desk."
what = "It also ends Face presence's \"you've stepped away\" (never as an arrival: no greeting), so talking from out of the camera's view isn't being away. Only the fact goes anywhere: never a word or the voice."
when = "Turn it off if talking near the computer shouldn't count as being at it."
needs = "Voice listening with Voice ID on and enrolled."

[s."presence.owner_here.dashboard"]
tip = "Using the dashboard (buttons, Ctrl+K, journal, capture, Study mode) counts as you at the desk."
what = "Your first and last sign of life of the day, at your desk for the forecast, it ends Face presence's away (no greeting), and while Kurooto sleeps it wakes it, as a tap does."
when = "Turn it off if the dashboard is used by someone else, or from elsewhere."

[s."presence.owner_here.phone"]
tip = "Using the phone app (chat, buttons, answers, Today) counts as you being around, not at the desk."
what = "Your first and last sign of life of the day, and while Kurooto sleeps it wakes it, as a tap does. It never counts as at the desk. These fire with every phone sense off."
when = "Turn it off to keep phone app use out of Brain's sense of your day."
needs = "Brain on (the phone signs are read through it)."

[s."mind.sleep.follow_desk"]
tip = "Starting a talk at the desk wakes Kurooto, and you at the desk near the night's end is you being up."
what = "A look that opens a conversation, talking over it with a question or request, or a Gemini Live turn wakes it as its name does. Face presence seeing you at the desk in the night's last 90 minutes, while it's awake or woken, ends its night, and what waited for the morning goes out. Asleep, the latch holds: sitting down doesn't wake it."
when = "Turn it off to have only its name, /wake, a message, a tap or a call wake it, and only the alarm, \"I'm up\" or your phone end its night."
needs = "`mind.sleep.on`; Voice listening and Face presence for the parts that need them."

[s."mind.sleep.follow_external"]
tip = "An add-on's reading that you're asleep (a dark, quiet room, you away) starts Kurooto's night there."
what = "An add-on with its own senses (the Body add-on's desk phone) can say you're asleep. The reading is always noted; with this on, the night starts at it, up to two hours early, as with your phone's onset. A window set by hand isn't moved."
when = "Turn it on if the add-on's room reading is a good sign you've gone to bed."
needs = "`mind.sleep.on` and an add-on that reports it."

[s."mind.presence_forecast.reachable"]
tip = "Check-ins and calls Kurooto places by itself go by whether you're reachable: at the desk or on your phone."
what = "A second estimate beside at-the-desk, learned the same way from the phone app's use (and the phone's screen sense, if on). It's never lower than the desk one, and equals it until an hour of the week has been seen; it isn't scored. A call rings now while you're on your phone. What's said aloud keeps the desk estimate."
when = "Turn it off to have check-ins and calls go by the desk estimate alone, as in 0.8.18."
needs = "`mind.presence_forecast.prefer`."

[s."mind.presence_forecast.busy_hint"]
tip = "An add-on's usual busy hours (times only) show as a hint on /mind and Start-by messages."
what = "For example \"Tue and Thu evenings are usually busy.\" Nothing shows until an add-on gives busy times; never who or why."
when = "Turn it off to hide the hint."

[s."mind.presence_forecast.visitors"]
tip = "An add-on's usual busy hours also lower the forecast there a little (never a block)."
what = "The chance you're free in those hours is cut by 40%, so a check-in or a call Kurooto places by itself may move to a nearby likelier hour. Times only, never who; nothing goes into a log or to an AI."
when = "Turn it on if those evenings really are bad times for Kurooto's own check-ins and calls."
needs = "`mind.presence_forecast.on`, and an add-on that gives busy times."
