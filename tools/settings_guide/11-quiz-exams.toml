title = "Quiz and exams"
page = "quiz-and-exams.md"
intro = """Spaced practice from your notes, exam mode before a quiz or exam, the optional Exam season with its revision
plan and exam-day help, revision packs, and study packs to give another AI. With Chat on, your AI grades your answers;
otherwise you grade yourself."""
cost = "Quiz questions and your answers go to your AI for grading when Chat is on; a quiz call goes through your call line and Gemini Live. Everything else stays here."
needs = "The Quiz feature (Exam season is a feature of its own)."

[s."quiz.per_session"]
tip = "Questions in one quiz."
when = "Raise it for longer sessions; lower it for a quick daily habit."

[s."quiz.learning_now"]
tip = "A quiz session ends with one extra card on a concept you're learning now (marked by another feature)."
what = """Another feature (an add-on) may mark concepts you keep coming back to this week on Brain's frontier. Then a
session asks its usual cards first, in the same order, and one more that names a marked concept, headed \"learning
now\". A card you already answered today isn't picked."""
when = "Turn it off to keep sessions to the cards that are due."
needs = "Quiz, Brain's model of what you know (`mind.tom.on`), and a feature that marks concepts."

[s."quiz.exam_per_session"]
tip = "Questions in one quiz while exam mode is on."
when = "Raise it if you want heavier practice close to exams."
needs = "Exam mode (`deadlines.exam_mode_days`)."

[s."quiz.offer_at"]
tip = "The evening before a quiz or exam, practice is offered from this time; empty: never."
values = "A time `HH:MM`, or empty."
when = "Move it to when you'd study; empty it to stop the offer."

[s."quiz.exam_daily"]
tip = "In exam mode, a practice check-in every day at this time; empty: never."
values = "A time `HH:MM`, or empty."
when = "Set it (say, `18:00`) for a daily habit in the weeks before exams."
needs = "Exam mode."

[s."quiz.by_call"]
tip = "/quiz, \"quiz me\" and quiz check-ins ring you instead of coming as text."
when = "Turn it on if you revise better out loud. Saying \"here\" keeps one quiz in text."
needs = "Phone calls."

[s."quiz.call_min"]
tip = "Minutes a quiz call is meant to take."
when = "Change it to fit how long you like to be quizzed."
needs = "`quiz.by_call`."

[s."quiz.links"]
tip = "Recall cards from the links in your concept graph come by themselves."
what = "A card asks how two linked concepts relate. `/card` gives one any time."
when = "Turn it on for small daily recall between sessions."
needs = "The Concept graph."

[s."quiz.links_at"]
tip = "When a link card may come (never during a class, focus time or the night)."
needs = "`quiz.links`."
when = "Pick times you're usually free for a minute."

[s."quiz.links_per_day"]
tip = "The most link cards in a day (at most 5)."
when = "Lower it if they feel like too many."
needs = "`quiz.links`."

[s."quiz.links_check"]
tip = "A model on this computer says how close your answer to a link card came."
when = "Turn it on if you want feedback on link cards; it never uses a cloud AI."
cost = "Nothing leaves: Local AI models only."
needs = "`quiz.links` and Local AI models."

[s."exam_season.hold_updates"]
tip = "During exams, updates that aren't critical wait until the exams are over."
when = "Turn it off if you want updates as usual during exams."
needs = "Exam season, with exam periods set (`/term exams`)."

[s."exam_season.budget"]
tip = "During exams, only deadlines, quizzes and the alarm come in the day; the rest waits for the evening."
when = "Turn it off to keep your usual flow of messages during exams."
needs = "Exam season."

[s."exam_season.no_calls"]
tip = "Hold every call while an exam is on."
when = "Leave it on; turn it off only if exams aren't on your timetable at their real times."
needs = "Exam season."

[s."exam_season.exam_min"]
tip = "How long an exam lasts, in minutes (no calls then; the debrief comes half an hour after)."
when = "Set it to your exams' usual length."
needs = "Exam season."

[s."exam_season.alarm_check"]
tip = "Every night of the exam period: will tomorrow's alarm ring?"
when = "Turn it off if you don't use Kurooto's alarm for exam mornings."
needs = "Exam season and the Morning alarm."

[s."exam_season.night_at"]
tip = "When the nightly alarm check runs."
when = "Set it before you usually go to bed."
needs = "`exam_season.alarm_check`."

[s."exam_season.eve"]
tip = "The evening before an exam, a checklist: where it is, your seat, calculator, ID card."
when = "Turn it off if you have your exam-day checklist under control."
needs = "Exam season."

[s."exam_season.eve_at"]
tip = "When the evening-before question can come."
needs = "`exam_season.eve`."
when = "Move it to when you pack your bag."

[s."exam_season.leave_alarm"]
tip = "On an exam day, an alarm to leave (a call with Phone calls, else a message)."
when = "Turn it off if you live next to the exam hall."
needs = "Exam season."

[s."exam_season.leave_min"]
tip = "Minutes before the exam the leave alarm goes, unless you say a time (\"leave 8:10\")."
when = "Set it to your travel time plus a margin."
needs = "`exam_season.leave_alarm`."

[s."exam_season.in_calls"]
tip = "The wake-up call and the night check-in name the exam that day or the next, when to leave, and a wake time to suggest."
when = "Turn it off to keep those calls as they were. The alarm is still set only when you agree to a time."
needs = "Exam season, with the Morning alarm or check-ins."

[s."exam_season.debrief"]
tip = "After each exam, a two-minute debrief that goes into the subject's course note."
when = "Turn it off if you'd rather not look back right after an exam."
cost = "Nothing: your debrief is saved as you said it."
needs = "Exam season."

[s."exam_season.debrief_at_desk"]
tip = "The debrief waits until you're back at your desk or the phone arrives at the place you saved as home."
when = "Turn it on if the debrief half an hour after the exam comes while you're still out. It comes 90 minutes after at the latest."
needs = "Exam season; Face presence or the activity sense, or the phone's places."

[s."exam_season.quiz_call_at"]
tip = "When a quiz call you picked rings the evening before an exam."
needs = "Exam season and Phone calls."
when = "Move it to when you'd revise."

[s."exam_season.quizzes"]
tip = "Treat quizzes and tests outside an exam period as exams too."
when = "Turn it on if your quizzes matter as much as exams."
needs = "Exam season."

[s."exam_season.revision"]
tip = "A revision plan before each exam: its topics ranked and fitted into your free time (/revise)."
when = "Turn it off if you plan revision yourself."
cost = "Nothing: plain arithmetic on this computer, no AI."
needs = "Exam season; free time comes from Start-by dates."

[s."exam_season.revision_days"]
tip = "Days before each exam that the revision plan starts."
when = "Raise it to spread revision out; lower it for a shorter run-up."
needs = "`exam_season.revision`."

[s."exam_season.revision_share"]
tip = "The share of your free time (in %) revision blocks may take."
when = "Raise it in heavy exam weeks; lower it if the plan crowds out everything else."
needs = "`exam_season.revision`."

[s."exam_season.block_min"]
tip = "Minutes in one revision block (one topic each)."
when = "Shorten it if you focus better in short bursts."
needs = "`exam_season.revision`."

[s."exam_season.learning_now"]
tip = "/revise <course> starts with a line of its topics you're learning now (concepts another feature marked)."
what = "A line above the ranked topics; the ranking and the plan's blocks are the same as without it."
when = "Turn it off to see only the ranked list."
needs = "`exam_season.revision`, Brain's model of what you know, and a feature that marks concepts."

[s."exam_season.revision_ask"]
tip = "Each evening: did you cover today's revision topics? (Counts like a quiz answer.)"
when = "Turn it off if you'd rather not be asked."
needs = "`exam_season.revision`."

[s."skills.auto_pack"]
tip = "The evening before a quiz or exam, a revision pack: ask first, build it, or never."
when = "Pick `auto` if you always want one; `off` if you never use them."
cost = "Building a pack is an AI request with that subject's notes."
needs = "Skills."

[s."skills.auto_pack_after"]
tip = "Revision packs aren't offered before this time of day (12 to 36 hours before the exam)."
when = "Move it to when you'd look at one."
needs = "`skills.auto_pack`."

[s."studypack.instructions"]
tip = "Your own extra lines and a format phrase (\"pdf too\") go into the study pack's prompt."
when = "Turn it off to use the plain prompt only."
cost = "Nothing leaves: the pack is a zip you send yourself; it never uses your AI."
needs = "Skills (`/studypack`)."

[s."studypack.extra"]
tip = "Your own rules for the other AI, added to the end of every study pack's prompt."
values = "Lines of text, one rule each."
when = "Add standing instructions (\"use my notation\", \"LaTeX for maths\") you'd otherwise type each time."
cost = "Nothing leaves: it goes into the zip you send yourself."
needs = "`studypack.instructions`."

[s."studypack.cited_pages"]
tip = "Pages of the readings your class cites (\"B&D S2.3\") a study pack takes whole, past the usual 250; `0`: off."
what = "The readings your class material cites (a syllabus's \"B&D S2.3\", \"Salby Chapter 2\") go into a study pack whole, before any other book pages and past the usual 250, up to this many pages for all the books."
values = "A number of pages for all the books together; `0`: off (cited pages share the usual 250 and come only with a topic, as before 0.8.13)."
when = "Lower it if the other AI can't hold that much; raise it for a long syllabus. INDEX.md lists each citation and the pages it became."
cost = "Nothing leaves: the pages go into the zip you send yourself."
needs = "Skills (`/studypack`), and Books having read the books."

[s."quiz.to_doubts"]
tip = "After a call, the quiz questions you missed on it (graded below 3) are offered as doubts, in one message."
when = "Turn it off if you'd rather not get that message after quiz calls."
needs = "The Doubt queue."

[s."hints.weak_sign"]
tip = "Needing the last hint (the key step) counts as a small sign of a gap in Brain's model of what you know."
when = "Turn it off if hints shouldn't change how Kurooto pitches explanations."
needs = "Brain, with its model of what you know (`mind.tom.on`)."

[s."quiz.call_frontier"]
tip = "On a call, the due questions on concepts you're ready for (Brain's frontier, or partly known) come first."
what = "Only the order of the questions already due changes; none is added or dropped. The call's AI also gets those concepts' names."
when = "Turn it on if you'd like a call's quiz to aim where you're learning now."
needs = "Brain, with its model of what you know (`mind.tom.on`)."

[s."exam_season.use_mastery"]
tip = "The revision plan places topics with no quiz grade yet by Brain's mastery of their concept, frontier first."
what = "Only within a topic's group (no note, a stub, weak recall, the rest); your grades and answers still decide, and no topic is dropped."
when = "Turn it on with Brain if you'd like its model of what you know to order ungraded topics."
needs = "Exam season, and Brain with its model of what you know (`mind.tom.on`)."

[s."exam_season.graph_first"]
tip = "In exam season, the concept graph reads the courses with an exam in the next revision days first."
what = "Like putting them in `integrate.first` by hand until the exam: their class material and books move up the queue; nothing is dropped."
when = "Turn it on if you'd like the graph to catch up on what you're about to be examined on."
needs = "Exam season and the Concept graph."

[s."quiz.links_frontier"]
tip = "Of the link cards due the same day, those on concepts you're ready for (Brain's frontier) come first."
when = "Turn it on if you'd like link cards to aim where you're learning now; an overdue card still comes first."
needs = "`quiz.links` (or `/card`), and Brain's model of what you know."
