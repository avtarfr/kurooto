title = "Face presence"
page = "face.md"
intro = """Kurooto learns your face, on this computer only, and greets you by voice when you sit down at your desk after a
while. The camera looks at a few frames a second at most, only while you're not typing, and never keeps a picture: your
face is a small encrypted template, a stranger's face is dropped with the frame, and nothing is sent anywhere."""
cost = "A little processor time while it watches (about 1-3% of one core), and the camera's light on while it looks."
needs = "The Face presence feature, a camera, and Voice speaking for the greeting."

[parent."face.addons"]
tip = "What add-ons may do with Face presence: see who's in view, and keep the camera looking while you type."

[s."face.addons.known_guests"]
tip = "An add-on may say that everyone else in view is someone it knows: they get the short greeting instead of none."
what = "A yes or no only: Face presence never learns who, and keeps nothing of it. With face.greet.with_others at skip, a remembered friend at the desk then gets \"Welcome back.\" with no details and no conversation."
when = "Turn it off to keep skipping the greeting whenever anyone else is in view."
needs = "An add-on that remembers people (with its own switch)."

[s."face.light_sense"]
tip = "Read the room's light from the camera's frames, as one smoothed number, for Brain and add-ons."
what = "Only while the camera looks anyway: each frame's average brightness, smoothed, kept in memory as one number (dark to lit) and never a frame. A webcam adjusts its exposure, so it's a rough signal, not a light meter. Brain's sense of its body uses it when no other device reports its light; an add-on may use it to set a screen's brightness."
when = "Turn it on if you have no phone or other device reporting the room's light."
needs = "Face presence watching."

[parent."face.track"]
tip = "Follow every face in view while the camera is open, so the being's eye can look at whoever is there."

[parent."face.away"]
tip = "Notice when you leave the desk, and hold what Kurooto would start by itself until you're back."

[parent."face.camera"]
tip = "Which camera Face presence uses and the picture size it asks for."

[parent."face.greet"]
tip = "The greeting when you sit down: when, how often, what it says, and whether it then listens."

[parent."face.learn"]
tip = "Refining your face template slowly from times it was very sure it was you."

[parent."face.recognise"]
tip = "How sure it must be that a face is yours, and how far away a face may be."

[parent."face.watch"]
tip = "When the camera looks: how often, on battery, at night, and with the screen locked."

[s."face.away.on"]
tip = "Notice when you leave the desk and come back."
when = "Turn it on if you want calls and pop-ups held while you're away from the computer."

[s."face.away.after_min"]
tip = "No sign of you (your face or the keyboard) this long means you've left, in minutes."
when = "Lengthen it if it decides you've left while you're reading."

[s."face.away.use_places"]
tip = "Your phone leaving a place you saved marks you away from the desk at once."
what = "Uses Brain's phone places sensor (the places you saved in the phone app). Leaving one makes Face presence decide you've left now instead of after a few minutes with no sign of you, so held calls and pop-ups start waiting sooner. Arriving somewhere doesn't mark you back: your face or your keyboard does. Only that the phone left and when are used, in memory; the place's name stays in the senses' store."
when = "Turn it on if you walk away from the desk with your phone and want Kurooto to know straight away."
needs = "Noticing when you leave (face.away.on), Brain on and its phone places sensor (mind.senses.phone.places)."

[s."face.away.places_close_camera"]
tip = "While your phone is out, keep the camera closed."
what = "With use_places: from the phone leaving a saved place until it arrives at one, or someone types at the computer, Face presence pauses (\"your phone is out\"). Nothing watches an empty room then, so no arrival is seen by the camera and nobody else at the desk is noted."
when = "Turn it on if you'd rather the camera rested while you're out."
needs = "face.away.use_places."

[s."face.away.report_others"]
tip = "While you're away, note the times someone else's face was in view at your desk, and tell you once when you're back."
what = "Times and how many faces only, in memory, forgotten once told: never a picture, never who, never sent to your AI. Faces it isn't sure about (maybe you) don't count, and it only knows about the times the camera was looking."
when = "Turn it on if you want to know whether someone used your computer while you were out."
cost = "One message on your return when someone was seen."
needs = "Noticing when you leave (face.away.on)."

[s."face.away.hold_calls"]
tip = "While you're away, calls Kurooto would start by itself wait for you (up to the longest wait below)."
when = "Turn it off if you'd rather a call rings the phone anyway."
needs = "Noticing when you leave (face.away.on)."

[s."face.away.hold_desktop"]
tip = "Hold desktop pop-ups and spoken answers until you're back at the desk."
when = "Turn it off if others at the computer should still see Kurooto's pop-ups."

[s."face.away.hold_max_min"]
tip = "The longest a call waits while you're away, in minutes."
when = "Shorten it for things that can't wait long."

[s."face.camera.device"]
tip = "The camera to use: empty for the first ordinary one (infrared ones are skipped), or a number or part of its name."
when = "Set it if you have several cameras and it picks the wrong one (`kurooto face test-camera` lists them)."

[s."face.camera.width"]
tip = "The picture width asked of the camera (it may give another)."
when = "Lower it on a slow computer; recognition needs only a small picture."

[s."face.camera.height"]
tip = "The picture height asked of the camera."
when = "Change it together with the width."

[s."face.greet.on"]
tip = "Greet you by voice when you arrive at the desk."
when = "Turn it off if you only want it to notice you, without speaking."
needs = "Voice speaking."

[s."face.greet.after_absent_min"]
tip = "Greet you only after you've been away at least this long, in minutes."
when = "Raise it if it greets you after short breaks."

[s."face.greet.gap_min"]
tip = "The fewest minutes between two greetings."
when = "Raise it if the greetings feel too frequent."

[s."face.greet.per_day"]
tip = "A daily cap on greetings."
when = "Lower it to one for just a morning greeting."

[s."face.greet.say"]
tip = "What the greeting tells you: what's next today, what's waiting, deadlines in 24 h, what was held while you were away."
what = "Parts: next, waiting, deadline, held, and (0.9.0) answers: how many answers weren't read aloud while you were away (a yes right after reads them)."
when = "Trim it to what you want to hear first when you sit down."

[s."face.greet.tell_ai"]
tip = "When you answer the desk greeting, your AI is told what it had just said, so \"yes\" carries on from it."
what = "Only with the first thing you say in the conversation the greeting opened, as a line of that turn's context. The greeting is rule-made: counts, and the title of your next class or a deadline (which your AI can read anyway); never anything the camera saw."
when = "Turn it off if you'd rather the greeting's words never leave the computer; a bare \"yes\" may then need more words."
cost = "A few dozen more words in that one request to the AI you picked."

[s."face.greet.records"]
tip = "With Brain on, each greeting is one of its decision records, closed by whether you answered it."
what = "It records which parts the greeting said (never its words or anything the camera saw) and, when the conversation opened, whether you said anything in it. The nightly look back reads how greetings went and may suggest a different gap between them (face.greet.gap_min); nothing changes without your tap."
when = "Turn it off if you don't want greetings in Brain's records or the look back's suggestions."
needs = "Brain, for the records; the nightly look back, for the suggestions."

[s."face.greet.addons"]
tip = "An add-on may add one short line of its own to the desk greeting."
what = "Said after everything else, only with nobody else in view, and at most 120 characters. At the greeting's length limit it's the first to go, so it never pushes out what's next or what waits. If the greeting didn't say it, the add-on says it its own way, as before."
when = "Turn it on to hear an add-on's news (something it noticed while you were away) in the one welcome rather than separately."
needs = "An add-on that uses it."

[s."face.greet.talk"]
tip = "After the greeting, listen for a reply without its name being said."
when = "Turn it off if you'd rather start every talk by saying its name."
needs = "Voice listening."

[s."face.greet.listen_s"]
tip = "How long that conversation stays open with nothing said, in seconds."
when = "Shorten it if it keeps listening longer than you'd like."

[s."face.greet.with_others"]
tip = "When someone else is in view too: skip the greeting, say just \"Welcome back.\", or the full greeting."
values = "`skip`, `short`, `full`."
when = "Leave it on skip so your day isn't read out in front of others."

[s."face.track.on"]
tip = "While the camera is open, follow every face in view (where it is and how much it moves) for the being's eye."
what = """Each face gets a number that stays with it from frame to frame, its place, its size, whether it's you and how
much it moves (small nods and turns). The being's eye looks at one person, then another every few seconds, sooner
when someone new appears or moves more. Nobody else is identified, nothing is kept, and it never opens the camera
by itself."""
when = "Turn it off if you'd rather the eye only finds you, or to save the processor time."
cost = "With a dashboard in sight, roughly a tenth of one processor core while the camera is open."
needs = "Face presence watching; a dashboard page in sight, or an add-on that follows faces."

[s."face.track.fps"]
tip = "How many times a second it looks for faces while following them (1 to 15)."
what = """Only finding faces runs this often; recognising you stays at face.watch.fps. On a slow computer it lowers
itself when a look takes too long."""
when = "Lower it to save processor time; raise it for a livelier eye."
cost = "Each look a second costs about 1% of one processor core."
needs = "face.track.on."

[s."face.addons.watch"]
tip = "Let an add-on see who's in view: each face's place, size and numbers, in memory only, never a picture."
what = """An add-on gets every face in each frame Face presence already looks at: where it is, how big, which way it's
turned, whether it's you, someone else or unsure, and its numbers (kept by the add-on only if it says so). With no
add-on asking, nothing is worked out for it."""
when = "Turn it off to keep add-ons from seeing faces at all."
needs = "An add-on that uses it; Face presence watching (every pause still applies)."

[s."face.addons.hold"]
tip = "Let an add-on keep the camera looking while you type (never past a pause, the night, a call or a switch)."
what = """Normally the camera closes while you use the keyboard and mouse. An add-on may ask it to keep looking, for at
most 10 minutes at a time unless it asks again; the Face card and /face then say which add-on and why. Every pause
reason still comes first. While it looks, other programs (a video call) can't use the camera on Linux."""
when = "Turn it off if the camera's light on while you type bothers you, or you want the camera free for calls."
cost = "The camera's light on, and a little processor time, while an add-on holds it."
needs = "An add-on that uses it; Face presence watching."

[s."face.learn.on"]
tip = "Slowly refine your face template from times it was very sure it was you (never unsure ones), with Undo."
when = "Turn it on if your look changes (glasses, a beard, the light at your desk) and you'd rather it keeps up."

[s."face.learn.from_voice"]
tip = "A turn Voice ID is sure is your voice, with only your face in view, may teach the face model too."
what = "Learning otherwise needs you to type within a minute of being recognised on arrival. With Voice ID on, a turn it is sure is your voice by the voice alone (not one your face helped decide), while exactly one face is in view, yours, and nobody else is about, is the same kind of confirmation: the clear, confident frame of you from the last 3 seconds may be learned from, with the same spacing, cap and Undo."
when = "Turn it on if you mostly talk to Kurooto at the desk rather than type after sitting down."
needs = "Learning (face.learn.on) and Voice ID."

[s."face.learn.every_h"]
tip = "At most one new sample this often, in hours."
when = "Raise it to make the template change more slowly."

[s."face.learn.margin"]
tip = "How far above your threshold a frame's score must be before it may refine your template."
when = "Raise it to learn only from the surest frames."

[s."face.learn.max"]
tip = "At most this many learned samples (the oldest goes first); the enrolled ones are never replaced."
when = "Lower it to keep the template closer to your enrolment."

[s."face.recognise.frames"]
tip = "Recognised in this many of the last 4 frames means you're here."
when = "Raise it if it thinks you've arrived when you only passed by."

[s."face.recognise.min_face_px"]
tip = "Faces smaller than this many pixels are ignored: too far away to judge."
what = "Pixels of a 640x480 (or 480x640) picture; a sharper camera scales it (2.25 times at 1080x1440)."
when = "Lower it if you sit far from the camera."

[s."face.recognise.strictness"]
tip = "How rarely a stranger may pass: loose (1 in 100 frames), normal (1 in 1,000) or strict (1 in 10,000)."
values = "`loose`, `normal`, `strict`."
when = "Strict if others often sit at your desk; loose if it fails to recognise you in poor light."

[s."face.recognise.threshold"]
tip = "0 uses the calibrated threshold; a score from 0 to 1 overrides it (never below 0.363)."
when = "Leave it at 0 unless the live test on the Face page shows it gets it wrong."

[s."face.watch.fps"]
tip = "How many pictures a second it checks while waiting for you (0.2 to 2)."
when = "Lower it to save processor time; raise it if it's slow to notice you."

[s."face.watch.fps_battery"]
tip = "Frames a second while the computer is on battery."
when = "Lower it (or to 0) to save battery."

[s."face.watch.look_fps"]
tip = "While Voice listens for a look (voice.listen.look_to_talk), the camera checks at least this many pictures a second."
what = """A look opens the conversation after voice.listen.look_dwell_s of frames (by your eyes, at the first one:
voice.listen.look_gaze_dwell_s), so a faster rate makes it react sooner. It applies only while Voice holds the camera to listen; otherwise face.watch.fps does. At most 5; a slow
computer halves it as it does face.watch.fps."""
values = "Frames a second, 0 to 5 (default 5; 0 keeps face.watch.fps)."
when = "Lower it to save processor time; raise it if a look is slow to open it."
cost = "A frame takes about 50 ms of one processor core at 1080x1440 (finding faces 14, recognising you 29, your eyes 7; a Ryzen 7 laptop), so 5 a second is about a quarter of one core while Voice listens."
needs = "`voice.listen.look_to_talk`; Voice listening."

[s."face.watch.idle_s"]
tip = "Seconds with no keyboard or mouse before the camera looks; while you type it doesn't need to."
when = "Raise it to keep the camera off more of the time."

[s."face.watch.night"]
tip = "Also look during the night hours (Availability's night); off pauses it at night."
when = "Turn it on if you work at your desk at night and want the greeting then too."

[s."face.watch.in_focus"]
tip = "Keep looking during focus and a study timer; off pauses the camera in focus, as before 0.9.0."
what = "Look to talk, the desk keeping Kurooto awake, and an add-on's eye (the desk phone's face) go on while you study."
when = "Turn it off if you want focus to mean no camera."

[s."face.watch.when_locked"]
tip = "Also look while the screen is locked; off pauses it while locked."
when = "Turn it on if you want it to notice you arriving at a locked computer."

[s."face.phone_badge"]
tip = "The phone app's Today shows whether this computer's camera is on, and why."
what = "Face presence's own line (looking for you, an add-on's hold by name, resting): words only, never a frame."
when = "Turn it off if you don't want that on your phone."
cost = "Sealed for each phone, with the rest of Today."
needs = "Face presence and `calls.today`."

[s."face.camera.yaw_offset_deg"]
tip = "How far beside the camera's lens the spot you look at sits, in degrees (+: to your right); look to talk centres there."
what = "A camera whose lens isn't where you look (a drawn eye on a screen beside a phone's punch-hole camera, a webcam off to one side of a picture you look at) makes a look at that spot read as a turned head. This moves the centre of look to talk, by the head's turn and by the eyes alike, onto the spot. An add-on with such a camera may set it while its camera is in use and clear it after."
values = "-30 to 30 degrees; 0 (the default) is the lens itself."
when = "Set it if looking at the place you're meant to look rarely opens a conversation and looking at the lens does: about 7 degrees for 7 cm at 60 cm."

[s."face.breaks"]
tip = "Leaving, looking up at the camera and standing up are natural breaks for Brain's door."
what = "A message Brain holds until a natural break (mind.workspace.breaks) can go when Face presence sees you leave (with face.away.on), look at the camera for a second, or stand up (your face well under its usual desk size). Kinds and times only."
when = "Turn it off if messages arrive at moments that don't feel like breaks."
needs = "Face presence on and enrolled; Brain's mind.workspace.breaks."
