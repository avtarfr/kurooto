# Local models offered per hardware profile. Sizes are download sizes in GB (Ollama library, 2026-10-19).
# Edit here (and ship an update) when better small models come out; no code change needed.

[models.embed]
tag = "nomic-embed-text"
size_gb = 0.27
use = "embeddings for the notes brain (GBrain)"
min_vram_gb = 0

[models.helper-small]
tag = "qwen3:4b-instruct-2507-q4_K_M"
size_gb = 2.5
use = "quick decisions and short summaries; fits a 4 GB graphics card"
min_vram_gb = 3.5

[models.helper-large]
tag = "gemma4:e4b"
size_gb = 6.6
use = "quick decisions, summaries and longer local answers, and reading handwriting; needs 8 GB of graphics memory"
min_vram_gb = 7.5
vision = true  # it reads pictures too: handwritten notes on 8 GB cards (the vision model, when there is one, first)

[models.vision]
tag = "gemma4:12b"
size_gb = 8.0
use = "reading handwriting and images locally; needs 12 GB of graphics memory"
min_vram_gb = 11.5

[profiles]
light = []
apple-8 = ["embed"]
apple = ["embed", "helper-small"]
small-gpu = ["embed", "helper-small"]
big-gpu = ["embed", "helper-large"]
big-gpu-12 = ["embed", "helper-large", "vision"]
