# Everything Kurooto can install for you, where it comes from, and how much disk it needs.
# Official sources only. Updated with Kurooto, so a moved download is fixed by an update, not by you.
# kinds: script (the vendor's own installer script), download-run (an installer program), download-zip,
#        download-tar (unpacked into Kurooto's own folder), download-dmg (macOS: an app copied out of a disk
#        image), winget, flatpak, url (we open the page for you), none (not made for that system; `why` says so)

[agy]
title = "Antigravity (agy)"
why = "The AI brain 'agy': free with a Google account."
size_gb = 0.2
programs = ["agy"]
dirs.windows = ["%LOCALAPPDATA%/agy/bin"]
dirs.macos = ["~/.local/bin"]
dirs.linux = ["~/.local/bin"]
install.windows = { kind = "script", shell = "powershell", script = "irm https://antigravity.google/cli/install.ps1 | iex" }
install.macos = { kind = "script", shell = "bash", script = "curl -fsSL https://antigravity.google/cli/install.sh | bash" }
install.linux = { kind = "script", shell = "bash", script = "curl -fsSL https://antigravity.google/cli/install.sh | bash" }
signin = ["agy"]
signin_hint = "A window opens: sign in with your Google account, then close it."

[ollama]
title = "Ollama"
why = "Runs small AI models on this computer (picked for your hardware)."
size_gb = 5  # Linux: a 1.4 GB download that unpacks to about 3.5 GB (GPU libraries)
programs = ["ollama"]
dirs.windows = ["%LOCALAPPDATA%/Programs/Ollama"]
dirs.macos = ["~/Applications/Ollama.app/Contents/Resources", "/Applications/Ollama.app/Contents/Resources"]
dirs.linux = ["{app}/ollama/bin"]
install.windows = { kind = "download-run", url = "https://ollama.com/download/OllamaSetup.exe", args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"] }
install.macos = { kind = "download-zip", url = "https://ollama.com/download/Ollama-darwin.zip", into = "~/Applications" }
install.linux = { kind = "download-tar", url = "https://ollama.com/download/ollama-linux-{arch}.tar.zst", into = "{app}/ollama" }
serve = ["ollama", "serve"]

[node]
title = "Node.js"
why = "Needed for phone calls and deploying your call line."
size_gb = 0.12
programs = ["node"]
dirs.windows = ["{app}/node"]
dirs.macos = ["{app}/node/bin"]
dirs.linux = ["{app}/node/bin"]
install.windows = { kind = "node-lts" }
install.macos = { kind = "node-lts" }
install.linux = { kind = "node-lts" }

[telegram-desktop]
title = "Telegram Desktop"
why = "Optional: chat with your bot from this computer too (your phone's Telegram works on its own)."
size_gb = 0.25
programs = ["telegram-desktop", "Telegram"]
dirs.windows = ["%APPDATA%/Telegram Desktop"]
dirs.macos = ["/Applications/Telegram.app/Contents/MacOS", "~/Applications/Telegram.app/Contents/MacOS"]
dirs.linux = []
install.windows = { kind = "winget", id = "Telegram.TelegramDesktop" }
install.macos = { kind = "url", url = "https://desktop.telegram.org/" }
install.linux = { kind = "flatpak", id = "org.telegram.desktop", fallback = "https://desktop.telegram.org/" }

[bun]
title = "Bun"
why = "Runs GBrain, the notes brain."
size_gb = 0.1
programs = ["bun"]
dirs.windows = ["~/.bun/bin"]
dirs.macos = ["~/.bun/bin"]
dirs.linux = ["~/.bun/bin"]
install.windows = { kind = "script", shell = "powershell", script = "irm https://bun.sh/install.ps1 | iex" }
install.macos = { kind = "script", shell = "bash", script = "curl -fsSL https://bun.sh/install | bash" }
install.linux = { kind = "script", shell = "bash", script = "curl -fsSL https://bun.sh/install | bash" }

[gbrain]
title = "GBrain"
why = "Your notes brain: search your notes by meaning, and memory for your AI."
size_gb = 0.35
programs = ["gbrain"]
dirs.windows = ["~/.bun/bin"]
dirs.macos = ["~/.bun/bin"]
dirs.linux = ["~/.bun/bin"]
install.windows = { kind = "bun-global", spec = "github:garrytan/gbrain#v0.60.299.0" }
install.macos = { kind = "bun-global", spec = "github:garrytan/gbrain#v0.60.299.0" }
install.linux = { kind = "bun-global", spec = "github:garrytan/gbrain#v0.60.299.0" }

[codex]
title = "Codex CLI"
why = "The AI brain 'ChatGPT / Codex', for people with a ChatGPT plan."
size_gb = 0.2
programs = ["codex"]
dirs.windows = ["{app}/npm"]
dirs.macos = ["{app}/npm/bin"]
dirs.linux = ["{app}/npm/bin"]
install.windows = { kind = "npm-global", spec = "@openai/codex" }
install.macos = { kind = "npm-global", spec = "@openai/codex" }
install.linux = { kind = "npm-global", spec = "@openai/codex" }
signin = ["codex", "login"]
signin_hint = "A window opens: sign in with your ChatGPT account, then close it."

[claude]
title = "Claude Code"
why = "The AI brain 'Claude Code', for people with a Claude plan (Advanced)."
size_gb = 0.25
programs = ["claude"]
dirs.windows = ["~/.local/bin"]
dirs.macos = ["~/.local/bin"]
dirs.linux = ["~/.local/bin"]
install.windows = { kind = "script", shell = "powershell", script = "irm https://claude.ai/install.ps1 | iex" }
install.macos = { kind = "script", shell = "bash", script = "curl -fsSL https://claude.ai/install.sh | bash" }
install.linux = { kind = "script", shell = "bash", script = "curl -fsSL https://claude.ai/install.sh | bash" }
signin = ["claude"]
signin_hint = "A window opens: sign in with your Claude account, then close it."

[git]
title = "Git"
why = "Notes sync: keeps your notes in your own private GitHub repository."
size_gb = 0.15
programs = ["git"]
dirs.windows = ["{app}/mingit/cmd"]
dirs.macos = []
dirs.linux = []
check.macos = ["xcode-select", "-p"]  # /usr/bin/git exists on every Mac, but only works with Apple's tools
install.windows = { kind = "download-zip", into = "{app}/mingit", urls = { amd64 = "https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip", arm64 = "https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-arm64.zip" }, sha256s = { amd64 = "da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be", arm64 = "38b33dc6024026e3315cf88ab2cfea65205bbd7bb3a8e824bd21c8ad4fe609a7" } }
install.macos = { kind = "script", shell = "bash", script = "xcode-select --install || true", then = "Apple's installer opened: click Install, wait until it finishes (a few minutes), then press Set up again." }
install.linux = { kind = "url", url = "https://git-scm.com/download/linux" }


[tectonic]
title = "Tectonic"
why = "Optional: turns revision packs (LaTeX) into PDFs. A single-program LaTeX engine; the first PDF fetches the LaTeX packages it needs (about 50 MB)."
size_gb = 0.15
programs = ["tectonic"]
dirs.windows = ["{app}/tectonic"]
dirs.macos = ["{app}/tectonic"]
dirs.linux = ["{app}/tectonic"]
# Windows on ARM runs the x64 build (Tectonic publishes no ARM build for Windows)
install.windows = { kind = "download-zip", into = "{app}/tectonic", urls = { amd64 = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip", arm64 = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip" }, sha256s = { amd64 = "f61ce51f0b0ade1015b7de7ef368541c5424e9756ecbd0d7af97d6d48030845f", arm64 = "f61ce51f0b0ade1015b7de7ef368541c5424e9756ecbd0d7af97d6d48030845f" } }
install.macos = { kind = "download-tar", into = "{app}/tectonic", urls = { amd64 = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-apple-darwin.tar.gz", arm64 = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-aarch64-apple-darwin.tar.gz" }, sha256s = { amd64 = "7c90ef5b6ddb1eb1937e4337add5237b79338e4b9676459fa91187d24d6cdf80", arm64 = "a3f1cac7c5678f01661a92212f58480ae3b0634115d880dbc59e2953ded45667" } }
install.linux = { kind = "download-tar", into = "{app}/tectonic", urls = { amd64 = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz", arm64 = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-aarch64-unknown-linux-musl.tar.gz" }, sha256s = { amd64 = "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7", arm64 = "b10954a95404f3ab2328d2fa59a5ebab8e657f893fab096f98be8db7c0c979b8" } }

[kitty]
title = "kitty"
why = "Optional: the terminal Kurooto Terminal opens in on Linux and macOS (the official build, in Kurooto's own folder; your own kitty is used if you have one). About 45 MB to download, 160 MB unpacked."
size_gb = 0.25
programs = ["kitty"]
dirs.windows = []
dirs.macos = ["{app}/kitty.app/Contents/MacOS", "~/Applications/kitty.app/Contents/MacOS", "/Applications/kitty.app/Contents/MacOS", "/opt/homebrew/bin", "/usr/local/bin"]
dirs.linux = ["{app}/kitty/bin", "~/.local/kitty.app/bin"]
install.windows = { kind = "none", why = "kitty doesn't run on Windows: Kurooto Terminal uses Windows Terminal there." }
install.macos = { kind = "download-dmg", into = "{app}", app = "kitty.app", url = "https://github.com/kovidgoyal/kitty/releases/download/v0.49.2/kitty-0.49.2.dmg", sha256 = "e524b894145d89cb76b584e3a9691196ae56bfa31d51384a44aa774252b7cef7" }
install.linux = { kind = "download-tar", into = "{app}/kitty", urls = { amd64 = "https://github.com/kovidgoyal/kitty/releases/download/v0.49.2/kitty-0.49.2-x86_64.txz", arm64 = "https://github.com/kovidgoyal/kitty/releases/download/v0.49.2/kitty-0.49.2-arm64.txz" }, sha256s = { amd64 = "d573618b911e9c461bd421b96c13c74c7f1cb2f1ac9c327818d4ff84366cf5c6", arm64 = "0c81a995614426cccf0fecaf7d104d47cd63bbccf173d14976e9f92e3d60fce6" } }

[fish]
title = "fish"
why = "Optional: the shell in Kurooto Terminal on Linux (the official single-file build, in Kurooto's own folder; your own fish is used if you have one). About 3 MB to download."
size_gb = 0.02
programs = ["fish"]
dirs.windows = []
dirs.macos = ["/opt/homebrew/bin", "/usr/local/bin", "/opt/local/bin"]
dirs.linux = ["{app}/fish/bin"]
install.windows = { kind = "none", why = "Kurooto Terminal uses PowerShell on Windows." }
install.macos = { kind = "none", why = "On a Mac, Kurooto Terminal uses fish if you have it (Homebrew: brew install fish), otherwise your own shell." }
install.linux = { kind = "download-tar", into = "{app}/fish/bin", urls = { amd64 = "https://github.com/fish-shell/fish-shell/releases/download/4.9.3/fish-4.9.3-linux-x86_64.tar.xz", arm64 = "https://github.com/fish-shell/fish-shell/releases/download/4.9.3/fish-4.9.3-linux-aarch64.tar.xz" }, sha256s = { amd64 = "8f643d10ad1abb0ef7072764c01ceb5cf61b2d373fda400cf60f0bad69b7e095", arm64 = "57349f0111728c64b703a84e611aa97ff4d1fa8466385d64e67bd5bc3ffa49fc" } }
