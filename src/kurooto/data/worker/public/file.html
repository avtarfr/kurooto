<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0f0a">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>A file from Kurooto</title>
<link rel="stylesheet" href="/call.css">
</head>
<body>
<main>
  <div>
    <h1 id="name">A file from Kurooto</h1>
    <p>Sent from your computer. Your call line keeps it sealed for a day; only this link opens it.</p>
  </div>
  <div id="msg" class="card" hidden></div>
  <a id="save" class="button" hidden>Save</a>
  <div id="text" class="card text" hidden></div>
  <a class="button quiet" href="/talk">Chat</a>
</main>
<script src="/file.js"></script>
</body>
</html>
