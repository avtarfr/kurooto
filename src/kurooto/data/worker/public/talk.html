<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kurooto">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Chat</title>
<link rel="stylesheet" href="/call.css">
</head>
<body>
<main>
  <div>
    <h1 id="who">Kurooto</h1>
    <p id="status">Type to your assistant as you would on Telegram: commands, reminders, questions for your AI.</p>
  </div>
  <div id="msg" class="card" hidden></div>
  <div id="log" aria-live="polite"></div>
  <p id="replying" class="status"></p>
  <textarea id="typed" rows="2" placeholder="Message" aria-label="Your message"></textarea>
  <div class="row">
    <button id="send">Send</button>
  </div>
  <div class="row">
    <a class="button quiet" href="/">Call</a>
    <a class="button quiet" href="/inbox">Waiting for you</a>
  </div>
</main>
<script src="/talk.js"></script>
</body>
</html>
