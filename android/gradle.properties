# Gradle settings for the app (android/build.sh passes the version as -PkurootoVersionCode / -PkurootoVersionName).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# never download SDK parts by itself: the SDK in ANDROID_HOME is used as it is
android.builder.sdkDownload=false
# Kotlin compiles inside Gradle's own process (no separate Kotlin daemon left running), and keeps its data in build/
kotlin.compiler.execution.strategy=in-process
# (build.sh points Kotlin's project folder into build/ with -Pkotlin.project.persistent.dir)
kotlin.code.style=official
